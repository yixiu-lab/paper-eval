rule_profile_id: MGMT-LIT-EVAL-V1
rule_profile_name: 管理学文献质量评价首版规则
version: V16
status: draft
scoring_scale: 100
# 两池标尺：基准池是「达到发表水准」的基准分，加分池是超过合格才拿得到的分数。两者相加 = scoring_scale。
# 基准池 60：各方面都合格的论文正好 60 分，与「60 分及格」的直观一致；超出合格的部分放进加分池。
# V13 起额外强制：每个维度都必须 基准:加分 = 6:4（即 Σ该维基准规则权重 = 0.6 × 维度权重）。
# 原因：scorer 的维度满分是摊分出来的（pool × 该维规则权重 / 池总权重），不是直接取维度权重；
# 只有每维 6:4 时摊分结果才等于声明的维度权重。V12 下 B 满分 25.26/声明 20、D 21.95/25 就是这个缺口。
scoring_pools:
  baseline: 60
  bonus: 40
# 证据预算随规则库版本化：分数绝对值依赖每条规则的证据条数（实测 10→20 段整体上移约 7 分），
# 不能悄悄改，否则历史分数与专家标注的可比性会静默失效。
# V15 补充：上面这条只挡住了「条数」变化。V15 改的是**选哪 10 条**（关键词表去污染 + C/D 专属召回 +
# 每规则 retrieval_terms + 可选检索层），条数不变但分数会变——预算治理必须同时盯「条数」与「选择逻辑」。
evidence_budget:
  max_evidence_per_rule: 10
judgement_policy: Agent 只输出档位与证据；权重、分值映射和全部算术由 Harness 按规则库声明确定性执行。 总分 = 基准池 × 基准达成率 + 加分池 × 加成分 = 60 × 基准达成率 + 40 × 加成分。 权重分三层且逐层精确求和：Σ维度权重 = Σ构念权重 = Σ规则份额；加不平由 validate_rule_profile 拒绝。 维度满分由两池摊分得出（基准池 60 × 该维基准规则权重 / Σ基准规则权重 + 加分池 40 × 该维加分规则权重 / Σ加分规则权重），因此每个维度必须满足 基准:加分 = 6:4，此时维度满分才等于声明的维度权重。 每条规则的 role 决定它是基准项还是加分项（一个构念不跨角色）：基准项衡量「够不够发表水准」，**合格即满分**——mostly 与 partial 同记 1.0，只有 weak 0.5 / not_satisfied 0.0 扣分，且不设 satisfied；加分项衡量「有没有超出合格」，只有 satisfied 记 1.0（mostly 0.5 / partial 0.25 / weak·not_satisfied 0.0），只加分不扣分。 每条规则另有 retrieval_terms（英文检索词），供证据选择使用：规则锚点是中文、被评论文是英文，拿中文搜英文正文恒不命中。 score_mapping 是唯一的档位分值真源。 标尺版本 MGMT-SCALE-V5；无法判断不进分子也不进分母（宽松口径）。
dimensions:
- dimension_id: A
  dimension_name: 选题价值与问题定位
  weight: 15
  description: 评价论文是否提出值得研究、清楚定位、能进入有效学术对话的问题。
- dimension_id: B
  dimension_name: 理论贡献与创新性
  weight: 20.0
  description: 评价论文是否改变、挑战、整合或推进既有理论对话。
- dimension_id: C
  dimension_name: 理论严谨性与假设逻辑
  weight: 20.0
  description: 评价概念、逻辑前提、推理链条、假设或命题构建是否严密。
- dimension_id: D
  dimension_name: 研究设计与方法质量
  weight: 25
  description: 评价研究设计、数据、测量、模型、识别和方法执行是否支撑研究问题。
- dimension_id: E
