- rule_id: B-THEORY-INTEGRATION-V1
  version: V1
  dimension_id: B
  dimension_name: 理论贡献与创新性
  indicator_name: 跨理论或跨学科整合
  definition: 判断论文是否把两个以上理论视角接到同一现象上。实证类论文通常以单一框架立论，本规则对其不适用。
  required_evidence: 需要引用理论来源、假设差异、整合方式、兼容性或理论交汇点的说明。
  evidence_location:
  - Theory
  - Literature Review
  - Discussion
  observation_points:
  - 是否说明为何需要多理论
  - 是否明确理论假设差异
  - 是否处理认识论/层级/人性假设兼容
  - 是否不是简单拼接理论
  judgement_values:
    satisfied: 整合的分工写到可核对的程度：读者能直接指出两个视角各自承担哪一部分解释，以及整合后新增的解释是什么，无需自行拼接
    mostly: 把不同理论视角接到同一现象上，说明各自负责解释哪一部分，读者能看出整合后得到单一视角给不出的解释
    partial: 分别使用多个理论视角，各自解释不同片段，读者能看出它们被放进同一篇论文，却看不出交汇发生在哪一处，多出什么说不清
    weak: 多个视角只作为背景或变量来源被先后引用，彼此不构成解释关系，理论部分更像多视角综述，贡献主张缺少整合支撑
    not_satisfied: 该要素缺失：只用单一理论视角，或多个视角只被先后引用，彼此之间没有形成任何解释关系
    uncertain: 解析缺失、候选证据过窄，或论文以单一视角立论而不涉及整合，使这一项缺少可依据的文本
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
