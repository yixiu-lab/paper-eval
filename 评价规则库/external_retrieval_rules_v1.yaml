- rule_id: B-CONCEPT-MECHANISM-NOVELTY-V1
  version: V1
  dimension_id: B
  dimension_name: 理论贡献与创新性
  indicator_name: 新概念、新机制或理论命题
  definition: 判断论文是否提出新的概念结构、机制解释、理论命题或因果结构，而不是仅报告经验关系。
  required_evidence: 需要定位到新概念、机制、模型、命题或理论结构的原文证据。
  evidence_location:
  - Theory
  - Findings
  - Discussion
  observation_points:
  - 是否从现象上升到概念
  - 是否提出可解释机制
  - 是否构建新的因果或过程结构
  - 是否避免停留于描述性发现
  judgement_values:
    mostly: 提出一个可指认的新机制、新构念或新测量路径，给出能把这项新内容与既有解释区分开的证据或论证
    partial: 有新提法或新测量，区分于既有解释的说明只到更细致、更贴合情境这类程度，改动的实质仍不清
    weak: 新提法基本是既有构念换了名称，读者按原有解释即可读懂所得结果，新增内容无法被指认，创新主张因此站不住
    not_satisfied: 该要素缺失：论文沿用既有构念与既有机制，或新提法只是换了名称，没有带来可辨认的解释差异
    uncertain: 解析缺失、候选证据过窄，或论文属复制检验一类不以新机制为目标的体裁，使这一项缺少可依据的文本
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 5.538461
  applicable_type: 通用
  source_reference:
  - Nadkarni et al. 2018
  - Bansal et al. 2018
  - 章凯等 2023
