    weak: 点到影响方向却未说明涉及哪类主体与何种时间尺度，读者无法据此形成对后果的实质判断
    not_satisfied: 全文未涉及研究现象在长期或社会层面的后果，读者找不到可据以判断影响范围的内容
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
