- rule_id: A-SCOPE-ACTIONABILITY-V1
  version: V1
  dimension_id: A
  dimension_name: 选题价值与问题定位
  indicator_name: 问题范围与可操作性
  definition: 判断研究范围是否足够支撑有意义贡献，同时问题设定是否可研究、可分析、可落地。
  required_evidence: 需要定位到论文对研究范围、构念边界、研究场景或可操作研究路径的说明。
  evidence_location:
  - Introduction
  - Theory
  - Methods
  observation_points:
  - 范围是否过窄或数据切片过薄
  - 是否覆盖关键构念、机制或情境
  - 是否能被研究设计回应
  - 是否能产生具体实践或理论洞见
  judgement_values:
    mostly: 研究范围收到能被本文数据与设计完整回应的程度，范围之外的问题被明确排除，读者不会期待本文回答它没有条件回答的问题
    partial: 范围交代清楚，仍留有超出设计能力的期待，读者能看出本文大致能答什么，宣称覆盖的构念或情境是否被数据触及仍不确定
    weak: 范围宽到任何单一研究都答不完，设计尺度与所宣称范围明显错位，读者无法判断哪部分结论有数据支撑，可信度因而下降
    not_satisfied: 该要素缺失：范围宽泛到无法由任何单一研究回应，或论文宣称覆盖的内容与其数据实际能覆盖的范围相悖
    uncertain: 解析缺失、候选证据过窄，或论文体裁不声明可操作范围，使这一项缺少可依据的文本
  score_mapping:
