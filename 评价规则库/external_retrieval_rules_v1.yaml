rules:
- rule_id: A-TOPIC-SIGNIFICANCE-V1
  version: V1
  dimension_id: A
  dimension_name: 选题价值与问题定位
  indicator_name: 研究问题重要性
  definition: 判断论文是否说明研究问题在理论、实践或社会层面具有重要性，而非只是小范围补缺。
  required_evidence: 需要能定位到论文说明该问题为何重要、为何值得研究的原文片段。
  evidence_location:
  - Abstract
  - Introduction
  - Motivation
  observation_points:
  - 是否指向重要理论问题或现实问题
  - 是否说明问题影响的对象和范围
  - 是否避免只以“较少研究”为主要理由
  - 是否体现 rigor 与 relevance 的结合
  judgement_values:
    mostly: 指出该问题不被解决会在理论或实践上产生什么可辨认的后果，读者能据此看出受影响的对象与量级，而不是只被告诉这个问题重要
    partial: 说明了问题重要，也点到受影响的对象，但后果只说到关系到某领域发展这类程度，读者勉强看出价值，损失内容仍未被交代
    weak: 只以研究热度、政策提法或文献数量说明重要，读者找不到不解决的后果与受影响对象，问题价值靠题材分量支撑，结论据此难以被认真对待
    not_satisfied: 该要素缺失：论文没有对问题重要性作实质定位，或把重要性等同于相关研究较少这类与价值无关的理由
    uncertain: 解析缺失、候选证据过窄，或研究范式不以重要性陈述进入问题，使这一项缺少可依据的文本
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 3.0
  applicable_type: 通用
  source_reference:
  - Colquitt & George 2011
  - Grant & Pollock 2011
  - Tihanyi 2020
  status: draft
  cluster: A-TOPIC
  retrieval_terms:
  - important
  - significance
  - pressing problem
  - practical relevance
  - theoretical relevance
  - consequences
  - organizations
  - society
  - policy
  - research gap
  - motivation
  - this study addresses
  rationale: 区分重要性表态与后果交代。合格线是读者能指认后果与受影响对象；仅表态重要落 partial，只靠热度或提法支撑落 weak；不谈价值或只以研究少为由落缺失。顶刊级重大议题由 top_journal_gate 承担。
  threshold: 摘要或引言有原文说明该问题不被解决所造成的具体后果，读者能指认受影响对象以及损失落在哪一环。
  mostly_threshold: 摘要或引言中有一句话交代该问题不被解决会造成何种后果，读者能指认受影响的对象。
- rule_id: A-GAP-PUZZLE-V1
  version: V1
  dimension_id: A
  dimension_name: 选题价值与问题定位
  indicator_name: Research Gap / Puzzle 清晰性
  definition: 判断论文是否明确指出现有研究不足、理论矛盾、经验异常、puzzle 或重要未解问题。
  required_evidence: 需要引用关于 gap、puzzle、paradox、breakdown、inadequacy 或研究空白的原文证据。
  evidence_location:
  - Introduction
  - Literature Review
  observation_points:
  - 是否说明既有研究知道什么
  - 是否指出不知道什么或解释不了什么
  - gap 是否与研究问题直接相关
  - 是否避免泛泛声称“尚无研究”
  judgement_values:
    satisfied: 缺口收窄到能被本文条件直接回应的具体未解项，读者能看出本文补上的是哪一步，这一步补上后哪类解释随之失效
    mostly: 指出既有研究解释不了或尚未处理的具体内容，缺口范围收到本文能正面回应的程度，读者能看出本文接的是哪一段对话
    partial: 提到了文献空白或结论矛盾，缺口边界偏宽，同题材论文都能声称在填补，读者能看出回应方向，落点却仍不确定
    weak: 缺口以此类研究尚少一类说法出现，读者看不出既有研究究竟缺了什么，本文与理论对话的关系悬空，推进主张随之站不住
    not_satisfied: 该要素缺失：引言没有指明既有研究缺什么或解释不了什么，或把缺口等同于此类研究尚少而与理论对话无关
    uncertain: 解析缺失、候选证据过窄，或研究范式不以缺口定位问题，使这一项缺少可依据的文本
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 3.0
  applicable_type: 通用
  source_reference:
  - Grant & Pollock 2011
  - Hollenbeck 2008
  - Colquitt & George 2011
  status: draft
  cluster: A-GAP
  retrieval_terms:
  - research gap
  - gap in the literature
  - puzzle
  - paradox
  - conflicting findings
  - little is known
  - unresolved
  - overlooked
  - has not been examined
  - prior research
  - extend prior work
  rationale: 区分提到空白与界定缺口。合格线是缺口窄到本文条件足以回应；边界偏宽落 partial，只称研究尚少落 weak；没有缺口落缺失。悖论级 puzzle 由 top_journal_gate 承担。
  threshold: 引言有一段说明既有研究已知什么、仍未解决什么，该未解决项能被本文的数据或论证直接回应。
  mostly_threshold: 引言点出一处既有研究未处理或解释不了的内容，读者能指认本文接续的是哪一项。
- rule_id: A-QUESTION-CLARITY-V1
  version: V1
  dimension_id: A
  dimension_name: 选题价值与问题定位
  indicator_name: 研究对象与研究问题明确
  definition: 判断论文是否清楚说明研究对象、核心问题、研究目标或假设检验对象。
  required_evidence: 需要能定位到研究对象、研究问题、研究目标或核心假设的原文片段。
  evidence_location:
  - Abstract
  - Introduction
  observation_points:
  - 研究对象是否可识别
  - 研究问题是否具体
  - 研究目标是否可执行
  - 问题、对象、目标是否相互对应
  judgement_values:
    mostly: 研究问题落到具体的对象、关系或过程上，读者能说出什么结果支持它、什么结果推翻它，问题边界因此可辨认
    partial: 研究方向清楚，对象也可指认，检验条件仍不明确，多种结果都可算作回答，读者无法确定本文要证成什么，推导缺少落点
    weak: 只给出研究主题或研究对象，读者看不出要检验哪种关系，问题在后续推导中始终没有收窄，结论回到泛泛陈述
    not_satisfied: 该要素缺失：全文找不到可辨认的研究问题，或问题表述与论文实际执行的分析内容相互矛盾，读者无法确定本文在回答什么
    uncertain: 解析缺失、候选证据过窄，或研究范式不以可检验问题组织全文，使这一项缺少可依据的文本
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 3.0
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Bono & McNamara 2011
  - Grant & Pollock 2011
  status: draft
  cluster: A-QUESTION
  retrieval_terms:
  - research question
  - we examine
  - this study investigates
  - research objective
  - hypotheses
  - research model
  - we test
  - the purpose of this study
  - focal construct
  - dependent variable
  - theoretical model
  rationale: A 维度恢复区分度的关键：把问题清楚升级为问题可证伪。合格线是读者能预设证伪条件；对象具体而检验条件不明落 partial，只剩主题落 weak；无可辨认问题落缺失。
  threshold: 摘要或引言给出的研究问题含具体对象与关系，读者能设想一个会否定它的观察结果。
  mostly_threshold: 摘要或引言能指认研究对象与所问关系，读者能说出该问题打算证成什么。
- rule_id: A-LITERATURE-POSITIONING-V1
  version: V1
  dimension_id: A
  dimension_name: 选题价值与问题定位
  indicator_name: 文献对话定位
  definition: 判断论文是否把研究放入清楚的学术对话中，说明与已有理论、发现或争议的关系。
  required_evidence: 需要引用论文对已有文献、理论路线、争议或共识的定位说明。
  evidence_location:
  - Introduction
  - Literature Review
  - Theory
  observation_points:
  - 是否说明相关理论视角
  - 是否解释与已有发现的关系
  - 是否避免只堆砌引用
  - 是否为后续贡献铺垫清楚
  judgement_values:
    satisfied: 把本文放进一场仍在进行的争论，点明双方各持什么、本文站在哪一侧，读者能看出若不接这一步哪条既有解释会随之失效
    mostly: 说明本文接的是哪一条理论路线或哪一场争论，读者能看出本文与既有结论处于延续、限定还是改写的关系
    partial: 综述覆盖了相关文献，站位只到研究领域一层，读者能看出对话范围，却认不出本文站在哪条路线或哪一侧，贡献难以对位
    weak: 文献按主题成段出现，读者看不出本文与任何既有结论之间存在取舍关系，对话对象始终虚化，贡献主张缺少可比照的参照系
    not_satisfied: 该要素缺失：文献仅以罗列方式出现，读者看不出本文与任何既有理论路线的关系，或论文没有把自己放进既有对话
    uncertain: 解析缺失、候选证据过窄，或论文属新兴议题而既有对话尚未成形，使这一项缺少可依据的文本
