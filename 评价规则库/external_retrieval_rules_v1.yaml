  - novel mechanism
  - theoretical contribution
  - we develop
  - we propose
  - conceptual model
  - reconceptualize
  - mechanism
  - theory building
  - extends theory
  - proposition
  rationale: 校准后这条认测量路径与机制细化，不要求完整理论体系，覆盖方法型与 AI 应用型论文的常见贡献形态。区分说不清落 partial，换名落 weak；沿用既有落缺失。
  threshold: 理论或讨论部分给出一个新机制、新构念或新测量路径，至少有一处说明它与既有解释的差别。
  mostly_threshold: 理论或讨论部分提出一个新机制、新构念或新测量路径，读者能说出它与既有解释的不同。
- rule_id: B-INTERESTINGNESS-V1
  version: V1
  dimension_id: B
  dimension_name: 理论贡献与创新性
  indicator_name: 有趣性与反直觉洞见
  definition: 判断论文是否提供反直觉、重新看待现象或揭示隐藏关系的洞见，并避免为了有趣牺牲可靠性。
  required_evidence: 需要引用论文如何否定、反转、重释或揭示既有认知的原文证据。
  evidence_location:
  - Introduction
  - Theory
  - Discussion
  observation_points:
  - 是否呈现看似 X 实为非 X 的洞见
  - 是否揭示意外关系或机制
  - 是否与重要问题相连
  - 是否避免 HARKing 或脆弱复杂模型
  judgement_values:
    satisfied: 张力来源与原有解释失效的原因写得具体：读者能直接指出是哪一个被忽略的机制在起作用，以及原有解释在哪一步不成立
    mostly: 呈现一处与直觉或既有结论方向不同的发现，说明张力来自什么，读者能看出原有解释为何不成立
    partial: 结果有新意，方向仍落在既有预期范围内，读者能看出本文想给出意外感，张力来源与原有解释是否被推翻都还说不清
    weak: 结果与既有预期方向一致，讨论却以反直觉为卖点，读者看不到支撑该说法的证据，有趣性主张反而削弱结论可信度
    not_satisfied: 该要素缺失：结果与既有预期方向一致，或论文以反直觉为卖点却拿不出与预期相左的证据支撑
    uncertain: 解析缺失、候选证据过窄，或论文属复制或方法检验一类不以意外发现为目标的体裁，使这一项缺少可依据的文本
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 3.555556
  applicable_type: 通用
  source_reference:
  - Davis 1971
  - Tihanyi 2020
  - Colquitt & George 2011
  status: draft
  cluster: B-INTERESTING
  retrieval_terms:
  - counterintuitive
  - surprising
  - unexpected
  - contrary to expectations
  - paradox
  - tension
  - challenges the assumption
  - we find that
  - interesting
  - intriguing
  - reverses
  rationale: 合格线是一处有证据支撑、与既有预期方向不同的发现，不要求颠覆认知。有新意但顺预期落 partial，与预期一致仍喊反直觉落 weak；无意外发现落缺失。颠覆性洞见由 top_journal_gate 承担。
  threshold: 结果或讨论中有一处发现偏离既有预期，该发现配有对应的系数、模式或案例证据。
  mostly_threshold: 结果或讨论中有一处发现与既有预期方向不同，或作者明确指出该发现为何不显然，读者能说出它偏离了什么。
  mostly_note: 不要求颠覆性结论；论文自己说清了'为何这个发现值得注意'即可。
- rule_id: B-DIALOGUE-ADVANCE-V1
  version: V1
  dimension_id: B
  dimension_name: 理论贡献与创新性
  indicator_name: 对既有认知的质疑、整合与推进
  definition: 判断论文是否通过质疑一处前提、整合文献分歧或指出相对既有理解的增量，说清本文推进了什么。三条路径任一走通即成立。
  required_evidence: 需要定位到论文关于 change、challenge、advance、new direction 或 research agenda 的说明。
  evidence_location:
  - Introduction
  - Theory
  - Discussion
  observation_points:
  - 是否点名一处可疑前提
  - 是否给出分歧来源的取向
  - 是否指出相对既有理解的具体增量
  judgement_values:
    mostly: 走通上述任一路径：点名一处可疑前提、给出分歧来源的取向，或指出本文相对既有理解多出什么，读者能指认推进落在哪里
    partial: 与文献有往来，但推进只以丰富了相关研究一类说法带过，读者能看出本文想推进，却说不出推进落在哪一处
    weak: 结论复述既有理解的要点，读者看不出本文相对文献多出什么，贡献主张缺少可指认的落点
    not_satisfied: 该要素缺失：全文未对既有认知提出质疑，未处理结论分歧，也未把本文认识与既有理解作对照
    uncertain: 解析缺失、候选证据过窄，或论文体裁不以相对既有理解的推进组织论证，使这一项缺少可依据的文本
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 6.461539
  applicable_type: 通用
  source_reference:
  - Colquitt & George 2011
  - Grant & Pollock 2011
  - Geletkanycz & Tepper 2012
  status: draft
  cluster: B-DIALOGUE
  retrieval_terms:
  - theoretical contribution
  - advance theory
  - challenge the assumption
  - dialogue
  - research agenda
  - we contribute
  - extend prior research
  - theoretical implications
  - conversation
  - shifts the debate
  - adds to the literature
  rationale: 原先把'质疑前提''整合分歧''指出增量'拆成三条并取平均，导致只走通其中一条路径的论文被其余两条拖低。现合并为一条：三条路径任一走通即达到 mostly，全部展开且有证据支撑为 satisfied。该构念总权重仍为 6 分，与合并前一致。
  threshold: 三条路径中至少一条被展开且有正文证据支撑，读者能指认该推进改变了哪个判断。
  mostly_threshold: 三条路径中至少一条走通：点名可疑前提、给出分歧取向，或指出相对既有理解的增量。
- rule_id: C-CONCEPT-CLARITY-V1
  version: V1
  dimension_id: C
  dimension_name: 理论严谨性与假设逻辑
  indicator_name: 概念定义与命名清晰
  definition: 判断核心概念是否定义清楚、命名恰当，并与理论逻辑和研究对象相匹配。
  required_evidence: 需要定位到核心概念定义、构念说明、命名依据或测量对应关系的原文片段。
  evidence_location:
  - Theory
  - Literature Review
  - Methods
  observation_points:
  - 概念定义是否明确
  - 新概念或重定义是否有理论依据
  - 是否避免 jingle/jangle 问题
  - 概念与研究问题是否匹配
  judgement_values:
    mostly: 大部分核心概念清楚界定涵盖与排除的现象范围，少数与相邻构念的界限仍需读者从上下文推出
    partial: 概念有定义，但界定偏宽或与相邻构念界限模糊，读者需要依靠上下文才能大致确定它所指的现象范围
    weak: 概念界定只点出部分特征，与相邻构念的交界处读者仍拿不准，据此操作容易与近邻构念混同
    not_satisfied: 核心概念只被提及而未被界定，或与相邻构念混用，读者无法确定该概念到底指向现实中的哪一类现象
    uncertain: 解析缺失或候选证据过窄，或论文属纯评论体裁而无需自行界定概念，使该判断缺少可依据的文本
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 4.0
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Shaw et al. 2018
  - Zhang & Shaw 2012
  status: draft
  cluster: C-CONCEPT
  retrieval_terms:
  - we define
  - definition
  - conceptualize
  - construct
  - distinct from
  - construct validity
  - refers to
  - conceptual definition
  - operationalize
  - related but distinct
  - domain of the construct
  rationale: 概念界定是后续推理的前提。五档是界定清晰度的阶梯：可辨认现象范围即算够，界定漂移但可推断尚可，读者需靠上下文定所指已是硬伤，只提及未界定则不够。
  threshold: 正文给出概念内涵界定，并说明它为何与最接近的相邻构念不重合，而非只划定涵盖范围。
  mostly_threshold: 正文至少一处给出核心概念的内涵界定，读者据此能判断该现象涵盖与排除的范围。
- rule_id: C-LOGIC-PREMISE-V1
  version: V1
  dimension_id: C
  dimension_name: 理论严谨性与假设逻辑
  indicator_name: 逻辑前提恰当
  definition: 判断理论推导依赖的事实前提、语义前提和适用前提是否清楚且合理。
  required_evidence: 需要引用论文理论推导中关键前提、假设或适用条件的说明。
  evidence_location:
  - Theory
  - Literature Review
  observation_points:
  - 前提是否符合事实
  - 语义是否清晰自洽
  - 前提是否适用于研究问题
  judgement_values:
    satisfied: 关键前提逐条给出依据与适用条件，读者无需代为接受任何一条即可跟随推导，主线之外的替代前提也被交代为何不取
    mostly: 关键前提多数可被识别，个别前提的依据或适用范围需读者代为接受，推导主线仍站得住
    partial: 关键前提部分被交代，个别前提依据不足或适用范围含糊，读者对其成立仍存疑问，但不致阻断后续推导
    weak: 关键前提虽能指出，但作者未说明它为何在此情境成立，读者代入本领域事实后会对其可靠性起疑
    not_satisfied: 推导所依赖的前提未被识别，或前提与研究现象明显不相称，使后续理论主张从一开始就失去支撑
    uncertain: 解析缺失或候选证据过窄，或论文体裁不依赖可指认的显式前提，使该判断缺少可依据的文本
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 2.666667
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Sparrowe & Mayer 2011
  status: draft
  cluster: C-PREMISE
  retrieval_terms:
  - premise
  - assumption
  - we assume
  - theoretical logic
  - taken for granted
  - building on
  - drawing on
  - underlying assumption
  - we argue
  - theoretical foundation
  - established theory
  rationale: 前提是理论链的地基。五档按前提可辩护程度递减：能指认又与情境相称即算够，个别前提需读者代为接受尚可，依据不明或与事实冲突即不够。
  threshold: 正文可指认关键前提及其依据，并交代该前提为何在本研究情境下成立，而非只列出前提。
  mostly_threshold: 正文能指认出至少一个关键前提，该前提与研究情境相称，未被文中其他事实否定。
- rule_id: C-REASONING-RIGOR-V1
  version: V1
  dimension_id: C
  dimension_name: 理论严谨性与假设逻辑
  indicator_name: 推理过程严密
  definition: 判断论文从理论、文献或数据到命题/假设/发现的推理链条是否完整、清楚、无明显跳跃。
  required_evidence: 需要定位到核心推理段落、命题推导、归纳发现解释或理论模型说明。
  evidence_location:
  - Theory
  - Findings
  observation_points:
  - 演绎推理是否清楚完整
  - 归纳推理是否与数据契合
  - 是否存在明显反例未处理
  - 结论是否由前文自然推出
  judgement_values:
    mostly: 推理主线可循，个别环节依赖未言明的假定或出现跳跃，读者需要自行补一步才能接上后面的结论
    partial: 推理主线能顺着读下来，但关键处缺少交代，读者得替作者补上一个理由才能让结论落地
    weak: 从前提到结论的若干环节只有断言而无理由，读者按文中论证推不出结论，只能当作作者的主张接受
    not_satisfied: 推理链存在明显断点，或结论不是由前文前提推出，读者依据文中论证无法复现该结论的得出过程
    uncertain: 解析缺失或候选证据过窄，或论文以叙述方式呈现而不展开完整推理过程，使该判断无法稳定作出
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 4.0
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Sparrowe & Mayer 2011
  - Bansal et al. 2018
  status: draft
  cluster: C-REASONING
  retrieval_terms:
  - we argue
  - theoretical argument
  - therefore
  - because
  - consistent with
  - in line with
  - hypothesis development
  - we predict
  - reasoning
  - derive
  - theoretical model
  rationale: 推理链是理论与假设之间的桥。五档按可复核程度递减：照文中步骤能推出结论即算够，需自行补步尚可，链条断裂或结论非由前提推出即不够。
  threshold: 从前提到核心命题的推导在文中可复核，且最易断裂的环节有作者明确交代。
  mostly_threshold: 推理主线完整可循，个别环节需读者自行补一步，或最易断裂处未主动处理，但结论仍能从文中论证推出。
  mostly_note: 不要求作者处理每一个潜在断裂点；只有读者按文中论证推不出结论时才降到 partial 以下。
- rule_id: C-HYPOTHESIS-GROUNDING-V1
  version: V1
  dimension_id: C
  dimension_name: 理论严谨性与假设逻辑
  indicator_name: 假设或命题扎根充分
  definition: 判断假设、命题或理论主张是否扎根于相关文献与理论叙事，而不是仅靠引用堆砌。
  required_evidence: 需要引用假设/命题之前的理论论证和相关文献对话。
  evidence_location:
  - Theory
  - Hypotheses
  observation_points:
  - 假设与相关研究关系是否清楚
  - 是否超越实证结果罗列
  - 读者到达假设时是否能预期
  - 是否解释构念为何相关
  judgement_values:
    mostly: 多数核心假设在提出之前有理论理由支撑，只有个别假设仅靠引用标记交代来源，读者仍能预期方向
    partial: 假设方向有理论依托，但依托停留在相关文献的罗列，读者仍难以看出这条关系为何应当被预期
    weak: 假设只与个别文献的结论挂上关系，缺少说明该关系为何在此情境中成立，方向像是从数据反推而来
    not_satisfied: 假设或命题与既有理论对话脱节，接近凭空提出，读者无法从文中找到任何应当预期该关系的理由
    uncertain: 解析缺失、候选证据过窄，或本文类型不产生假设与命题，使该规则缺乏可判断对象而无法稳定判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 4.0
  applicable_type: 定量/理论/混合
  source_reference:
  - Sparrowe & Mayer 2011
  - Grant & Pollock 2011
  status: draft
  cluster: C-HYPOTHESIS
  retrieval_terms:
  - hypothesis
  - we hypothesize
  - hypothesis development
  - we predict
  - theoretical rationale
  - prior research suggests
  - consistent with theory
  - hypothesized relationship
  - propositions
  - mediating
  - moderating
  rationale: 该规则区分假设有理论来源与靠常识、数据先行落地的论文。五档按假设从理论中长出的程度递减，读者读到假设前是否已被说服，决定它落在哪一档。
  threshold: 过半核心假设在提出前有理论理由支撑其方向，且至少一条说明该关系为何在此情境成立。
  mostly_threshold: 过半核心假设在其论证段前能找到支撑该关系方向的理论理由，而非只出现引用标记。
- rule_id: C-BOUNDARY-CONDITIONS-V1
  version: V1
  dimension_id: C
  dimension_name: 理论严谨性与假设逻辑
  indicator_name: 理论边界条件清楚
  definition: 判断论文是否说明理论或发现适用的情境、层级、时间、行业、文化或方法边界。
  required_evidence: 需要定位到边界条件、适用范围、情境限制或理论限制的原文说明。
  evidence_location:
  - Theory
  - Methods
  - Discussion
  observation_points:
  - 是否说明适用情境
  - 是否说明分析层级
  - 是否处理跨层级边界
  - 是否避免无限泛化
  judgement_values:
    satisfied: 适用情境、层级与时间条件分别写明并与理论机制挂钩，读者能指认边界之外主张失效的机制原因，无需自行补齐限定语
    mostly: 文中交代了主张成立的适用范围，个别限定语的具体所指需读者自行从上下文补齐，仍可大致圈定
    partial: 文中承认主张存在适用条件，但条件内容含糊，读者仍无法判断它在哪种情境或层级下能够成立
    weak: 只在结尾补一句适用范围，未与理论机制挂钩，读者据此仍分不清边界之外的主张为何失效
    not_satisfied: 理论主张被无条件地陈述，文中未交代其成立的适用范围，读者按字面理解会得到被过度推广的结论
    uncertain: 解析缺失或候选证据过窄，或论文属描述性体裁而不提出需限定范围的主张，使该判断难以稳定作出
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 2.666667
  applicable_type: 通用
  source_reference:
  - Sparrowe & Mayer 2011
  - Shaw et al. 2018
  - 章凯等 2023
  status: draft
  cluster: C-BOUNDARY
  retrieval_terms:
  - boundary condition
  - scope condition
  - moderating effect
  - contingency
  - under what conditions
  - applies to
  - limited to
  - generalizability
  - we focus on
  - theoretical scope
  - moderating role
  rationale: 边界决定主张能被用到哪里。五档按适用范围可推断的程度递减：条件可指认又解释得清即算够，仅承认有边界而说不清即不够，无条件陈述属过度推广。
  threshold: 至少一处说明命题成立的情境或层级条件，并交代该条件之外主张为何不再成立。
  mostly_threshold: 正文至少一处说明命题或结论成立所需的情境、层级或时间条件，而非只出现“存在边界”一类说法。
- rule_id: C-ALTERNATIVE-EXPLANATIONS-V1
  version: V1
  dimension_id: C
  dimension_name: 理论严谨性与假设逻辑
  indicator_name: 替代解释处理
  definition: 判断论文是否识别并处理可能的替代机制、竞争理论、反向因果或混淆解释。
  required_evidence: 需要引用论文对替代解释、竞争假设、控制策略或稳健性解释的说明。
  evidence_location:
  - Theory
  - Methods
  - Results
  - Discussion
  observation_points:
  - 是否提出 plausible alternative mechanisms
  - 是否通过理论或方法排除替代解释
  - 是否讨论反向因果或遗漏变量
  - 是否诚实说明仍无法排除的解释
  judgement_values:
    satisfied: 对核心主张构成威胁的替代机制被识别，文中用理论或方法给出排除理由，该威胁不再动摇核心结论
    mostly: 文中指出主要替代机制并说明它为何被排除，读者读完仍会追问残余威胁有多大、会不会翻盘
    partial: 文中以控制变量或附加设定间接回应替代解释，未直接说明它为何不成立，该威胁仍可被读者质疑
    weak: 只承认可能存在别的解释，未把它与本文核心主张对照说明，读者仍可用同一批材料给出另一种解释
    not_satisfied: 文中未识别与核心主张竞争的替代解释，读者可依据同一批材料提出另一种同样合理的解释来替代它
    uncertain: 解析缺失或候选证据过窄，或论文体裁不涉及因果或机制上的竞争解释，使该判断难以稳定作出
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 2.666666
  applicable_type: 通用
  source_reference:
  - Sparrowe & Mayer 2011
  - Bono & McNamara 2011
  - Zhang & Shaw 2012
  status: draft
  cluster: C-ALTERNATIVE
  retrieval_terms:
  - alternative explanation
  - rival explanation
  - reverse causality
  - omitted variable
  - confound
  - cannot rule out
  - robustness
  - control variables
  - endogeneity
  - selection bias
  - common method bias
  rationale: 替代解释是理论主张最易被攻击处。五档按排除程度递减：威胁被指名又给出理由即算够，只靠控制变量应付即不够，中间看残余威胁是否足以翻盘。
  threshold: 至少指名一个主要竞争解释，给出排除理由，并说明残余威胁不至于改变核心结论。
  mostly_threshold: 正文至少指名一个与核心主张竞争的替代解释，给出理论或方法上的排除理由。
- rule_id: C-WRITING-QUALITY-V1
  version: V1
  dimension_id: C
  dimension_name: 理论严谨性与假设逻辑
  indicator_name: 语言表达与写作清晰度
  definition: 判断论文的表达是否让读者能用最小阅读成本抓住论证结构：句子简洁、段落有主题句、逻辑连接承担真实推理关系、术语前后一致、图表与正文互相指路。
  required_evidence: 需要正文（非摘要）的段落级证据，覆盖引言/理论、方法、结果三类章节中的至少两类，用于判断表达简洁度与逻辑顺畅度。
  evidence_location:
  - Introduction
  - Theory
  - Methods
  - Results
  - Discussion
  observation_points:
  - 句子与段落是否简洁，能否一眼看出主题句
  - 段落之间、假设之间的逻辑连接是否顺畅，是否存在跳跃
  - 关键术语与构念命名是否前后一致
  - 图表是否被正文引用并解释
  - 是否存在因表达含混而无法复核论证的段落
  judgement_values:
    mostly: 表达整体基本清楚，局部存在冗长、术语漂移或连接跳跃，增加了阅读成本但不影响论证能否成立
    partial: 表达大致可读，但有相当篇幅需要回读才能确定论证走向，核心论证那几段仍能读懂
    weak: 多处表达含混或术语前后不一，读者需要反复回读，仍难以辨认核心构念究竟指什么
    not_satisfied: 表达妨碍论证复核，读者无论怎样回读都无法复述该部分在推什么，论证因此无法被检验
    uncertain: 正文证据不足，或论文属非标准写作范式、语言风格差异较大，在不误伤作者的前提下无法作出判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 0.0
  applicable_type: 通用
  source_reference:
  - 'Colquitt & George 2011（AMJ Part 3: Setting the hook）'
  - 章凯等 2023
  status: draft
  cluster: C-WRITING
  retrieval_terms:
  - we first
  - we then
  - in sum
  - taken together
  - as shown in
  - table
  - figure
  - however
  - therefore
  - we label
  - terminology
  rationale: 该规则不计分，只记录表达是否妨碍论证复核，不替代概念与推理判断。五档按阅读成本递减：顺畅可跟读算够，需局部回读尚可，无法复述论证即不够。
  threshold: 引言或理论、方法、结果中至少两类章节有明确主题句，读者不回读即可复述其论证结构。
  mostly_threshold: 正文的三类章节中至少两类能找到主题明确的段落，读者据此能复述该部分论证结构。
- rule_id: D-DESIGN-FIT-V1
  version: V1
  dimension_id: D
  dimension_name: 研究设计与方法质量
  indicator_name: 研究设计匹配研究问题
  definition: 判断研究设计是否能够回答论文提出的问题，尤其是因果、变化或过程问题是否使用匹配设计。
  required_evidence: 需要定位到研究设计、研究问题类型、样本/时间结构或识别策略的说明。
  evidence_location:
  - Methods
  - Research Design
  observation_points:
  - 因果问题是否避免单纯截面设计
  - 变化问题是否有时间维度
  - 过程问题是否有过程数据
  - 设计是否被数据可得性过度主导
  judgement_values:
    satisfied: 除结构相符外，还交代该设计排除了哪一类替代解释、以及该预期模式为何只有这种设计能检验，读者能看出换一种设计哪类结论会失衡
    mostly: 设计类别与问题的推断类型相符，只有在结论强度上存在小缺口，问题的回答对象未被改变
    partial: 设计在推断类型上存在明显短板，读者能看出所得结论只在附加假定之下才回应论文提出的问题
    weak: 设计难以支撑该推断，核心结论只能当作相关描述接受，算不上对研究问题的正面回答，差距已伤及可信度
    not_satisfied: 设计类型与研究问题不匹配，例如以横断面材料回答因果问题，所得结论无法回应论文提出的问题
    uncertain: 解析缺失或候选证据过窄，或论文未交代设计类型而无法从文本中判定，使该判断无法稳定地作出
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 6.0
  applicable_type: 通用
  source_reference:
  - Bono & McNamara 2011
  - 章凯等 2023
  - Bansal et al. 2018
  status: draft
  cluster: D-DESIGN
  retrieval_terms:
  - research design
  - cross-sectional
  - longitudinal
  - experimental design
  - random assignment
  - multi-wave
  - time lag
  - causal inference
  - identification strategy
  - field experiment
  - survey design
  - archival data
  rationale: 设计错配时后续执行再规范也答不了问题。五档按设计与推断类型的贴合度递减：结构能支撑该推断即算够，结论只在附加假定下成立已是硬伤。
  threshold: 正文可指认设计类型及其时间层次结构，并说明该结构为何足以回应所提推断类型。
  mostly_threshold: 正文能指认设计类型及其时间与层次结构，该结构足以回应论文提出的推断类型。
- rule_id: D-DATA-SAMPLE-V1
  version: V1
  dimension_id: D
  dimension_name: 研究设计与方法质量
  indicator_name: 数据来源与样本合理
  definition: 判断数据来源、样本选择、样本规模、时间范围和场景是否适合研究问题。
  required_evidence: 需要引用数据来源、样本获取、样本特征、时间范围或纳入排除标准。
  evidence_location:
  - Methods
  - Data
  - Sample
  observation_points:
  - 数据来源是否清楚
  - 样本是否匹配研究对象
  - 样本规模是否支持分析
  - 是否说明数据获取过程和限制
  judgement_values:
    satisfied: 除交代来源与规模外，还给出代表性能被检验的依据（与目标总体的对比、纳入排除标准或样本流失分析），读者能判断代表性偏差会把结论拉向哪一边
    mostly: 数据来源与规模交代清楚，取样方式与关键特征说明偏薄，代表性大致可信但读者仍存疑问
    partial: 来源与规模有交代，抽样方式或样本特征的说明不足，读者难以判断样本对目标总体的代表程度
    weak: 样本只在某一方面可用，而这一局限恰好覆盖论文的核心推断，结论只能收缩到更小的范围
    not_satisfied: 数据来源或样本规模缺失，或样本与研究总体明显错位，使论文的主要分析建立在不成立的样本之上
    uncertain: 解析缺失或候选证据过窄，或论文属理论、质性一类不以统计样本回答问题的体裁，使该判断难以作出
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 4.0
  applicable_type: 实证
  source_reference:
  - Zhang & Shaw 2012
  - Bono & McNamara 2011
  - 章凯等 2023
  status: draft
  cluster: D-DATA
  retrieval_terms:
  - sample
  - data collection
  - respondents
  - survey
  - sampling
  - response rate
  - sample size
  - data source
  - recruitment
  - firm-level data
  - representativeness
  rationale: 样本决定结论能覆盖谁。五档按样本可辩护程度递减：读者能判断代表性即算够，抽样说明偏薄尚可，样本错位或来源缺失则结论无处落地。
  threshold: 正文说明来源与抽样方式、样本规模，并给出代表性能被检验的依据，而非只描述样本构成。
  mostly_threshold: 正文说明数据来源与样本规模，样本特征足以让读者判断其与目标总体的对应关系。
- rule_id: D-MEASUREMENT-VALIDITY-V1
  version: V1
  dimension_id: D
  dimension_name: 研究设计与方法质量
  indicator_name: 构念测量与操作化有效
  definition: 判断变量、构念、编码或质性分类是否准确捕捉理论概念，并提供足够效度说明。
  required_evidence: 需要定位到测量来源、量表改编、编码规则、构念操作化或效度检验说明。
  evidence_location:
  - Methods
  - Measures
  - Coding
  observation_points:
  - 测量是否对应构念本质
  - 是否说明量表/条目来源
  - 改编是否有理由和效度证据
  - 编码和聚合决策是否清楚
  judgement_values:
    mostly: 测量方案基本对应构念，效度理由偏薄或改编依据不明，读者对两者是否等价仍会保留疑问
    partial: 测量或编码与构念大体对应，但效度依据偏薄，读者对操作化是否捕捉到构念本质仍存疑问
    weak: 操作化只覆盖构念的部分内涵，依据本身站得住，但所得结果对该构念的代表性已被实质削弱
    not_satisfied: 测量或编码与构念内涵错位，或操作化方式与研究问题相悖，所得变量无法代表所要检验的概念
    uncertain: 解析缺失或候选证据过窄，或论文属理论、模拟一类不产生测量操作的体裁，使该判断难以稳定作出
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 5.0
  applicable_type: 实证
  source_reference:
  - Bono & McNamara 2011
  - Zhang & Shaw 2012
  - 章凯等 2023
  status: draft
  cluster: D-MEASUREMENT
  retrieval_terms:
  - measurement
  - scale
  - items
  - construct validity
  - cronbach
  - factor analysis
  - reliability
  - adapted from
  - validated scale
  - discriminant validity
  - coding scheme
  rationale: 操作化错位会让结果与理论主张失去连接。五档按操作化与构念的等价程度递减：依据能支撑操作化即算够，只覆盖部分内涵属中间地带。
  threshold: 正文能指认测量或编码与构念的对应，并给出效度或改编依据使读者接受该操作化。
  mostly_threshold: 测量或编码方案与构念对得上，读者能接受该操作化；信度或效度检验不完整、改编依据未逐项交代不影响本档。
  mostly_note: 不要求报告全部信效度指标（如同时给出 α、CR、AVE）；只要操作化与构念的对应关系可辨认即可。
- rule_id: D-MODEL-IDENTIFICATION-V1
  version: V1
  dimension_id: D
  dimension_name: 研究设计与方法质量
  indicator_name: 模型设定与识别策略合理
  definition: 判断模型设定、控制变量、识别策略或分析框架是否合理，能否降低偏误并支持推断。
  required_evidence: 需要引用模型设定、控制变量、识别策略、估计方法或分析框架的原文说明。
  evidence_location:
  - Methods
  - Analysis
  - Results
  observation_points:
  - 模型是否与理论问题匹配
  - 控制变量是否有理论依据
  - 是否处理共同方法偏差
  - 是否考虑内生性或选择偏差
  judgement_values:
    mostly: 模型与识别策略针对该推断的主要威胁作出安排，读者能看出该威胁已被排除到不影响结论的程度
    partial: 识别安排只覆盖部分威胁，另有同样能解释所得结果的机制未被处理，推断强度因此受到限制
    weak: 识别安排多属例行程式，主要替代解释在文中得不到处理，因果口吻超出证据能支持的范围
    not_satisfied: 模型设定或识别依据缺失，主要替代解释未被排除，所得估计最终无法支撑论文所提出的因果主张
    uncertain: 解析缺失或候选证据过窄，或论文属质性、理论一类不使用统计模型的体裁，使该判断难以稳定作出
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 5.0
  applicable_type: 定量/混合
  source_reference:
  - Bono & McNamara 2011
  - Zhang & Shaw 2012
  - 章凯等 2023
  status: draft
  cluster: D-MODEL
  retrieval_terms:
  - identification
  - endogeneity
  - instrumental variable
  - two-stage least squares
  - difference-in-differences
  - fixed effects
  - control variables
  - model specification
  - selection bias
  - omitted variable
  - common method bias
  rationale: 识别安排能否排除替代解释决定因果主张是否成立，这是设计质量的核心。五档按威胁被排除的程度递减，未处理主要威胁时估计撑不起因果口吻。
  threshold: 正文说明识别安排如何排除主要替代解释，并交代该威胁被排除到何种程度。
  mostly_threshold: 正文说明模型设定与针对主要替代解释的识别安排，或说明该设计为何不产生识别问题。
- rule_id: D-METHOD-EXECUTION-V1
  version: V1
  dimension_id: D
  dimension_name: 研究设计与方法质量
  indicator_name: 方法执行规范
  definition: 判断定量、质性或混合方法的执行、分析和报告是否符合相应研究体裁规范。
  required_evidence: 需要引用数据收集、分析流程、编码过程、统计流程或方法执行细节。
  evidence_location:
  - Methods
  - Findings
  - Appendix
  observation_points:
  - 研究程序是否规范化
  - 执行步骤是否完整
  - 分析流程是否透明
  - 是否如实报告关键方法决策
  judgement_values:
    mostly: 主要步骤有交代，个别影响复核的细节缺失或前后说法不一致，读者需猜测某一步究竟如何处理
    partial: 主要步骤有交代，个别影响复核的环节存在缺口或前后说法不一致，读者需自行猜测该步如何处理
    weak: 执行步骤多处含糊，主要分析的处理顺序无法从文中重建，读者只能凭作者的报告接受结果
    not_satisfied: 关键分析步骤缺失，或执行方式违背该体裁的基本规范，读者无法复核论文所报告的主要分析结果
    uncertain: 解析缺失或候选证据过窄，或论文属理论、评论一类不以数据执行体现方法的体裁，无法稳定判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 3.0
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Zhang & Shaw 2012
  - Bansal et al. 2018
  status: draft
  cluster: D-EXECUTION
  retrieval_terms:
  - procedure
  - we collected
  - regression
  - structural equation model
  - coding process
  - data analysis
  - we followed
  - analytical approach
  - estimation
  - appendix
  - steps
  rationale: 执行规范决定结果能否被追溯。五档按流程可重建的程度递减：读者能照描述重走主要分析即算够，个别环节需猜测尚可，关键步骤缺失即无法复核。
  threshold: 至少两类主要分析章节交代收集与分析步骤，读者照描述能重建其处理顺序。
  mostly_threshold: 正文交代数据收集与分析的主要步骤，读者据此能复现核心分析的处理顺序。
- rule_id: D-QUAL-GENRE-FIT-V1
  version: V1
  dimension_id: D
  dimension_name: 研究设计与方法质量
  indicator_name: 质性研究体裁适配
  definition: 针对质性论文，判断其体裁、认识论、数据、分析和写作结构是否相互匹配。
  required_evidence: 需要定位到质性体裁、认识论立场、数据类型、分析过程或研究者反思说明。
  evidence_location:
  - Methods
  - Findings
  - Theory
  observation_points:
  - 是否说明本体/认识论假设
  - 问题-数据-分析是否一致
  - 是否避免模板生搬
  - 发现呈现是否符合体裁逻辑
  judgement_values:
    mostly: 质性方法整体基本成立，认识论立场或分析程序交代偏薄，在体裁、分析与呈现之间出现局部的张力
    partial: 质性方法基本成立，立场或分析程序交代偏薄，但读者仍能看出数据如何得出所报告的主题
    weak: 质性程序多处借自其他范式，立场与呈现之间的落差让所报告的发现难以被接受为对该问题的回答
    not_satisfied: 质性设计与所声明的立场或问题相悖，或用模板化流程套用不适配的体裁，发现呈现与该方法逻辑不符
    uncertain: 解析缺失或候选证据过窄，或论文不属质性体裁而使本规则不适用，无法稳定判断其适配的程度
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 2.0
  applicable_type: 质性
  source_reference:
  - Bansal et al. 2018
  - Bono & McNamara 2012
  status: draft
  cluster: D-QUAL
  retrieval_terms:
  - qualitative
  - case study
  - interviews
  - grounded theory
  - coding
  - thematic analysis
  - inductive
  - epistemology
  - ethnography
  - triangulation
  - informants
  - field notes
  rationale: 质性质量不看指标而看范式内部自洽。五档按立场、数据、呈现相互贴合的程度递减，借用量化模板或立场与分析相悖即不够。
  threshold: 正文说明质性立场、数据类型与分析程序，并说明该搭配为何适合所研究的问题。
  mostly_threshold: 正文说明质性立场或分析程序，其呈现方式与该立场、数据来源相符。
- rule_id: E-RESULTS-COMPLETENESS-V1
  version: V1
  dimension_id: E
  dimension_name: 证据、结果与结论可信度
  indicator_name: 结果呈现完整规范
  definition: 判断结果是否完整呈现核心分析、关键指标、统计/编码结果和必要的表格图示。
  required_evidence: 需要引用结果段落、表格、图或发现呈现中支持核心结论的信息。
  evidence_location:
  - Results
  - Findings
  - Tables
  - Figures
  observation_points:
  - 结果是否覆盖所有核心问题/假设
  - 统计或编码报告是否规范
  - 表格图示是否支持理解
  - 是否报告关键缺失或异常
  judgement_values:
    mostly: 每个核心问题在正文或表格里各有可读的数值与检验统计量，读者不必自己换算或推算就能核对结论
    partial: 核心问题的关键数值已报出，个别分析只给方向性描述或散落在多处，读者把几处对起来仍能核对结论
    weak: 关键分析只给显著性与方向，样本量、效应量或编码频次缺失，读者无从核对结论是否由这些结果得来
    not_satisfied: 多项结论在结果部分找不到对应数值或编码呈现，读者只能接受作者说法而无从核对
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 1.8
  applicable_type: 实证
  source_reference:
  - Zhang & Shaw 2012
  - 章凯等 2023
  status: draft
  cluster: E-COMPLETENESS
  retrieval_terms:
  - results
  - table
  - figure
  - coefficient
  - standard error
  - descriptive statistics
  - correlation matrix
  - sample size
  - model fit
  - regression results
  - p-value
  - confidence interval
  rationale: 结果可查是E维度后续判断的前提。五档按可核对程度下降：有分岔处理依据、可核对、需对照、不可核对、无可核对对象，缺失结果会让整条可信度链失效。
  threshold: 围绕每个核心问题都能定位到关键数值或编码结果，其呈现方式使读者无需自行推算即可核对。
  mostly_threshold: 每个核心问题至少一处关键结果见诸正文或表格，个别分析只给出方向或指向他表，读者对照后仍能核对结论。
  mostly_note: 不要求逐个报告系数与标准误；个别分析呈现简略但不妨碍核对结论即可。
- rule_id: E-RESULTS-ALIGNMENT-V1
  version: V1
  dimension_id: E
  dimension_name: 证据、结果与结论可信度
  indicator_name: 结果与问题/假设对应
  definition: 判断结果呈现是否直接回应研究问题、假设、命题或理论模型。
  required_evidence: 需要定位到结果如何对应研究问题、假设或理论主张的原文证据。
  evidence_location:
  - Results
  - Findings
  - Discussion
  observation_points:
  - 每个核心问题是否有结果回应
  - 假设检验是否逐项对应
  - 发现是否回到理论模型
  - 是否存在结果与主张脱节
  judgement_values:
    mostly: 任取一个核心问题或假设，都能指出直接回应它的结果，问题与结果的对应关系在文中可辨
    partial: 多数问题有结果回应，个别问题只被侧面涉及，这一处由读者自己接上问题与结果的对应关系
    weak: 部分问题所对应的结果只是擦边涉及，读者需自行判断该结果算不算回答，回应关系因此不稳
    not_satisfied: 问题提出后在结果中找不到对应回应，或以另一问题的结果顶替，读者无法确认该问题是否被回答
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 3.6
  applicable_type: 通用
  source_reference:
  - Zhang & Shaw 2012
  - Geletkanycz & Tepper 2012
  status: draft
  cluster: E-ALIGNMENT
  retrieval_terms:
  - results
  - hypothesis supported
  - hypotheses supported
  - partially supported
  - findings
  - hypothesis testing
  - mediation analysis
  - moderation analysis
  - in support of
  - theoretical model
  rationale: 只判问题与结果是否闭合，不判证据强弱。五档按回应直接性递降：逐条对应、个别需接、仅擦边、无回应，越往下结论越难追回问题。
  threshold: 任取一个核心问题或假设，都能指向至少一组直接回应它的结果，回应关系在文中明确可辨。
  mostly_threshold: 多数核心问题各有直接对应的结果回应，个别问题只侧面涉及，该处的对应关系由读者自己接上。
- rule_id: E-ROBUSTNESS-V1
  version: V1
  dimension_id: E
  dimension_name: 证据、结果与结论可信度
  indicator_name: 稳健性与补充分析
  definition: 判断论文是否通过稳健性检验、补充分析、替代模型、消融或三角验证增强结果可信度。
  required_evidence: 需要引用稳健性检验、替代模型、补充分析、消融或三角验证的原文片段。
  evidence_location:
  - Results
  - Robustness Checks
  - Appendix
  observation_points:
  - 是否使用替代测量或模型
  - 是否检查关键结果稳定性
  - 是否有补充或敏感性分析
  - 是否解释不稳健结果
  judgement_values:
    satisfied: 文中点名自己最弱的一处，说明何种结果会推翻主结论，该检验的设定、结果与结论是否改变都在正文里可指认
    mostly: 有一项稳健性或补充分析落在结论的要害环节，检验结果在文中报告，读者能看出该处威胁已按作者的说明被处理
    partial: 所做的稳健性或补充分析针对的是次要环节，最脆弱处未受检验，读者对该处是否成立仍存疑问
    weak: 只做了替代测量、换样本一类常规动作，没有针对结论脆弱处设计检验，读者不知威胁下结论是否成立
    not_satisfied: 全文找不到对结论脆弱环节的检验，或所设检验与主结论无关，主要质疑自始未被回应
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 1.5
  applicable_type: 实证
  source_reference:
  - Bono & McNamara 2011
  - Zhang & Shaw 2012
  - 章凯等 2023
  status: draft
  cluster: E-ROBUSTNESS
  retrieval_terms:
  - robustness check
  - robustness
  - alternative specification
  - sensitivity analysis
  - additional analysis
  - alternative measure
  - subsample
  - falsification test
  - control variables
  - placebo
  - results hold
  rationale: 判检验是否落在结论最脆弱的一环，不数检验数量。五档按着力点递降：自认弱点受检、要害受检、次要处受检、常规动作、未受检，越靠上结论越经得起主要质疑。
  threshold: 能指出一项检验直接针对作者自己承认的最弱环节，该检验的设定与结果都可指认，作者据此说明主结论是否改变。
  mostly_threshold: 至少有一项稳健性或补充分析落在结论的关键环节，结果已在文中报告，读者能看出该处威胁已按作者说明被处理。
  mostly_note: 不要求为每个核心关系都做检验；检验落在关键环节即可，其余次要关系可略。
- rule_id: E-EVIDENCE-STRENGTH-V1
  version: V1
  dimension_id: E
  dimension_name: 证据、结果与结论可信度
  indicator_name: 证据支撑强度
  definition: 判断论文使用的数据、分析和理论证据是否足以支撑核心主张。
  required_evidence: 需要定位核心主张及其对应证据，判断证据是否直接、充分、一致。
  evidence_location:
  - Methods
  - Results
  - Findings
  - Discussion
  observation_points:
  - 证据是否直接支持主张
  - 是否有多处一致证据
  - 证据是否来自正确章节
  - 是否存在相反证据未处理
  judgement_values:
    mostly: 主要主张在结果部分各有自己的估计值或检验统计量，文中没有留下未作说明却与主张相反的证据
    partial: 主要主张有直接证据，个别处证据仅间接相关或方向略有出入，作者已作说明，结论仍可接受
    weak: 主要主张中有一部分在结果部分找不到直接对应的分析，靠推理或邻近结果接上，读者对手头证据能否撑住结论存疑
    not_satisfied: 主要主张在结果部分找不到直接证据，或找到的证据方向与主张相反，结论实质悬空
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 3.6
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Bansal et al. 2018
  - Geletkanycz & Tepper 2012
  status: draft
  cluster: E-STRENGTH
  retrieval_terms:
  - evidence
  - support
  - coefficient
  - significant
  - effect size
  - confidence interval
  - consistent
  - findings
  - robust
  - path coefficient
  - hypothesis testing
  - direct evidence
  rationale: 判证据是否指向主张，与稳健性分工：那条问威胁是否受检，这条问证据指向何处。五档按证据与主张的贴合度递降，证据来自相邻结果与证据方向相反分别落在两级。
  threshold: 每条主要主张都能指回结果部分属于自己的估计值或检验统计量，文中没有方向相反却未作说明的证据。
  mostly_threshold: 每条主要主张至少有一处来自结果部分的直接证据，个别处证据间接或方向略有出入但作者已交代。
  mostly_note: 不要求跨方法或多子样本的相互印证；直接证据足以指回主张即可，该方法级印证留给其他规则。
- rule_id: E-CONCLUSION-VALIDITY-V1
  version: V1
  dimension_id: E
  dimension_name: 证据、结果与结论可信度
  indicator_name: 结论解释不过度外推
  definition: 判断结论是否基于结果合理解释，不夸大因果、范围、普遍性或实践含义。
  required_evidence: 需要引用论文对结论、解释、限制或推广范围的说明。
  evidence_location:
  - Discussion
  - Conclusion
  observation_points:
  - 结论是否回到证据
  - 是否避免超过设计能力的因果表述
  - 是否说明限制
  - 是否避免把局部发现泛化为普遍结论
  judgement_values:
    satisfied: 每条结论末了写明它站得住的限度，文中主动标出与它相冲突或未获证实的证据，读者引用时不必自行打折
    mostly: 结论的方向与适用范围没有穿过设计能支持的界线，读者把每句结论指回哪一组结果时不会落空
    partial: 结论大体有据，个别处用词强于证据，如以相关材料下因果判断，读者略作保留即可接受其方向
    weak: 多处表述明显强于证据，或把单一样本内的发现说成普遍规律，读者须自行打折后才能使用该结论
    not_satisfied: 结论与结果不一致，或把设计无法支持的主张作为结论提出，读者无法把结论回接到任一结果
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 1.5
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Geletkanycz & Tepper 2012
  - Tihanyi 2020
  status: draft
  cluster: E-CONCLUSION
  retrieval_terms:
  - we conclude
  - limitations
  - cannot be generalized
  - causal
  - caution
  - overstate
  - future research
  - boundary conditions
  - interpretation
  - external validity
  - robustness
  - we cannot rule out
  rationale: 只判结论是否超出证据限度，不问是否写了边界段落。五档按越界程度递降：自认张力、未越限、个别越界、多处越界、与结果相悖，越界会直接放大前面各处的证据不足。
  threshold: 结论中每一处因果或推广表述都能指回结果部分同强度的支撑，文中另有对相冲突或未证实证据的主动交代。
  mostly_threshold: 结论整体与结果相符，个别用词略强于证据，但不改变结论的方向与适用范围。
- rule_id: E-DISCUSSION-SYNTHESIS-V1
  version: V1
  dimension_id: E
  dimension_name: 证据、结果与结论可信度
  indicator_name: 讨论部分理论综合
  definition: 判断讨论是否整合结果，回到最初理论动机，并形成清楚的理论推进。
  required_evidence: 需要引用讨论中回归 theoretical puzzle、综合发现、说明 theoretical advance 的片段。
  evidence_location:
  - Discussion
  observation_points:
  - 是否回到最初理论动机
  - 是否回答 so what
  - 是否把发现整合成统一叙事
  - 是否说明对现有理论的改变
  judgement_values:
    satisfied: 讨论对本文主要结果给出机制或过程上的解释，说明结果为何以这种方式出现，读者能认出这一解释改写了既有说法中的哪一处
    mostly: 讨论说清本文相对既有理解多出了什么，该说法由本文结果支撑，读者能复述这句话而不必自行归纳
    partial: 讨论复述了结果也提到意义，但推进点说得含糊或与结果联系松弛，读者只能自己总结其理论增量
    weak: 讨论罗列发现后附带感想式的意义陈述，未说明相对既有研究多出什么，理论与结果彼此脱节
    not_satisfied: 没有实质讨论，或讨论内容与结果无关，发现停留在罗列而未形成任何判断
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 3.0
  applicable_type: 通用
  source_reference:
  - Geletkanycz & Tepper 2012
  - Grant & Pollock 2011
  status: draft
  cluster: E-DISCUSSION
  retrieval_terms:
  - discussion
  - theoretical implications
  - we contribute
  - our findings suggest
  - theoretical contribution
  - extend theory
  - theoretical lens
  - mechanism
  - in sum
  - advance
  rationale: E维度唯一判知识增量的规则，看讨论把结果解释成什么，不问它是否重述了贡献。五档按解释与结果咬合的程度递降：机制解释、说清增量、含糊、脱节、无判断，缺此则全文只停在结果复述。
  threshold: 讨论中能指认一处机制或过程的解释，该解释说明本文结果为何以这种方式出现，其依据可在正文中指认。
  mostly_threshold: 讨论有一句由本文结果支撑的推进说法，说清本文相对既有理解多出了哪一点，读者可直接复述。
  mostly_note: 不要求讨论开出新的研究议程；能说清一处推进点即可。
- rule_id: F-REPRODUCIBILITY-V1
  version: V1
  dimension_id: F
  dimension_name: 透明度、边界与实践意义
  indicator_name: 程序可复制性
  definition: 判断论文是否提供足够信息，使他人能够理解并复现研究程序、数据处理和分析过程。
  required_evidence: 需要引用研究流程、数据处理、分析步骤、参数、材料或附录说明。
  evidence_location:
  - Methods
  - Appendix
  - Supplementary Materials
  observation_points:
  - 程序是否结构化
  - 数据处理决策是否透明
  - 分析步骤是否可跟随
  - 是否提供必要参数或材料
  judgement_values:
    mostly: 方法部分给出样本纳入、变量构造与分析步骤，读者照着能重走主要分析，途中不必自己决定任何一步
    partial: 主要环节有描述，个别处如抽样方式或分析参数需要读者自己补一个决定才能接着往下做，重走时会出现分岔
    weak: 只交代分析框架与变量名称，样本纳入与关键参数缺失，读者能看懂思路却无法照着完成同一分析
    not_satisfied: 研究程序基本没有交代，或关键步骤与该体裁规范相悖，读者无法据此重走主要分析
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 1.0
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Zhang & Shaw 2012
  status: draft
  cluster: F-REPRO-TRANSPARENCY
  retrieval_terms:
  - procedure
  - data collection
  - analysis steps
  - coding
  - variable construction
  - measures
  - sample selection
  - replication
  - estimation procedure
  - supplementary materials
  rationale: 判按描述能否重走主要分析，替代原来的公开数据要求。五档按可照做程度递降：可照做、需自己补一步、仅有框架、无法重走。不公开数据不影响此条判定。
  threshold: 仅凭方法部分就能写出等效的分析步骤与关键参数，中途没有需要读者自行补足的处理决策。
  mostly_threshold: 方法部分交代样本纳入、变量构造与分析步骤，读者可照描述重走主要分析；个别参数或处理决策需推断。
  mostly_note: 不要求公开数据或逐步脚本；流程写到读者能重走主要分析即可。
- rule_id: F-DATA-CODE-TRANSPARENCY-V1
  version: V1
  dimension_id: F
  dimension_name: 透明度、边界与实践意义
  indicator_name: 数据、代码与材料透明
  definition: 判断论文是否说明数据、代码、量表、访谈材料、编码本或补充材料的可获得性。
  required_evidence: 需要定位到数据可得性、代码链接、材料说明、附录或公开仓库信息。
  evidence_location:
  - Methods
  - Data Availability
  - Appendix
  - Supplementary Materials
  observation_points:
  - 是否说明数据是否公开
  - 是否提供代码或分析材料
  - 是否提供量表/访谈提纲/编码本
  - 不公开时是否说明原因
  judgement_values:
    mostly: 文中有一句说明核心数据、代码或材料如何取得，读者据此能真的拿到，或明确交代不能共享的约束
    partial: 提供了量表条目、任务材料或附录中的部分内容，核心数据或代码的获取状态仍未说明，读者只能取得外围材料
    weak: 仅提到数据来自某机构或某平台，未说明能否再取得，读者不知该材料是否对外可用
    not_satisfied: 全文未提及数据、代码或材料的可获取性，读者无从判断能否取得，也无从据以复核
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 1.0
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Zhang & Shaw 2012
  status: draft
  cluster: F-REPRO-TRANSPARENCY
  retrieval_terms:
  - data availability
  - code availability
  - available upon request
  - replication package
  - open data
  - open materials
  - repository
  - survey instrument
  - coding scheme
  - ethical approval
  rationale: 与可复现分工：那条看流程写得够不够细，这条看材料能否拿到。五档按可取得程度递降：可到手、仅外围、仅来源、未提及，不以是否真正公开为尺度。
  threshold: 正文至少有一处说明核心数据、代码或材料的获取状态，含不公开时的原因或申请途径。
  mostly_threshold: 正文说明了核心数据或代码能否获取、获取途径是什么，或交代了不能共享的约束与可替代材料。
  mostly_note: 不要求数据真正公开；说明获取状态（含不公开的原因或申请途径）即可。
- rule_id: F-LIMITATIONS-V1
  version: V1
  dimension_id: F
  dimension_name: 透明度、边界与实践意义
  indicator_name: 局限讨论诚实具体
  definition: 判断论文是否诚实讨论研究限制，并将限制与设计、数据、方法或理论边界联系起来。
  required_evidence: 需要引用论文关于研究限制、潜在弱点、未解决问题或未来研究的说明。
  evidence_location:
  - Discussion
  - Limitations
  - Conclusion
  observation_points:
  - 是否承认设计或数据弱点
  - 是否说明限制对解释的影响
  - 是否避免模板化局限
  - 未来研究是否具体有价值
  judgement_values:
    mostly: 作者主动点出最影响结论的那处弱点，说明它限制哪类推断与适用范围，读者据此可用结论并留出折扣
    partial: 有局限段落，条目偏次要或偏模板，最影响结论的弱点只被擦边提到，读者仍需自行估计其影响
    weak: 局限段落只列举样本量、未来研究一类通用条目，未触及本文最关键弱点，读者看不出结论在何处最脆弱
    not_satisfied: 全文未讨论自身弱点，读者只能自行推测结论在哪些方面可能不成立
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 1.0
  applicable_type: 通用
  source_reference:
  - Geletkanycz & Tepper 2012
  - Zhang & Shaw 2012
  - 章凯等 2023
  status: draft
  cluster: F-LIMITATIONS
  retrieval_terms:
  - limitations
  - limitation
  - future research
  - future studies
  - caveat
  - generalizability
  - sample
  - weaknesses
  - cannot rule out
  - avenues for future research
  - design limitations
  rationale: 判作者是否自觉界定自家产出的可用范围，与结论规则互补：这条看作者自觉，那条看文本实际越界。五档按自觉程度递降，须触及最关键弱点方算够。
  threshold: 局限段落点名一项具体弱点，并说明它限制哪一类结论或哪一类情境下的使用。
  mostly_threshold: 局限段落点到最影响结论的那处弱点，说明它限制哪类结论或情境，读者据此可对结论打折使用。
  mostly_note: 不要求穷尽所有弱点；触及最关键的一处并说明影响即可。
- rule_id: F-EXTERNAL-VALIDITY-V1
  version: V1
  dimension_id: F
  dimension_name: 透明度、边界与实践意义
  indicator_name: 外部效度与适用范围
  definition: 判断研究结论推广到其他样本、时间、组织、行业、文化或情境的可信程度。
  required_evidence: 需要引用样本边界、情境边界、推广范围或外部效度讨论。
  evidence_location:
  - Methods
  - Discussion
  - Conclusion
  observation_points:
  - 是否说明样本和情境限制
  - 是否讨论跨时间或跨场景适用性
  - 是否有支持推广的证据
  - 是否避免不当普遍化
  judgement_values:
    satisfied: 除给出适用边界外，还提供跨样本、跨情境或跨时间的可比照证据，读者能就自身场景中的差异项判断结论是否需要修正
    mostly: 清楚交代结论适用于哪些对象、时间与情境，读者能判断在自身场景下能否沿用
    partial: 交代了样本与情境信息，但未把信息落到结论的适用范围上，读者需自行推断结论能走多远
    weak: 只描述样本构成而未指向结论适用范围，读者拿到样本特征仍不知可否搬到别的组织或时期
    not_satisfied: 未交代研究对象与情境，结论以不受限的口吻呈现，读者无法判断在自身场景能否沿用
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 1.0
  applicable_type: 通用
  source_reference:
  - 章凯等 2023
  - Bono & McNamara 2011
  status: draft
  cluster: F-EXTERNAL
  retrieval_terms:
  - external validity
  - generalizability
  - generalizable
  - sample boundary
  - context
  - boundary conditions
  - scope conditions
  - other settings
  - industry
  - cross-cultural
  - single country
  rationale: 判结论能否被读者搬到自己的场景。五档按可搬用程度递降：给出沿用前提、给出边界、有信息未落到边界、仅样本描述、无交代，与结论规则区别在这条看范围交代。
  threshold: 正文能定位到对适用对象、情境或时间范围的限定，而非仅描述样本构成。
  mostly_threshold: 正文有明确限定适用对象、情境或时间范围的表述，读者据此可判断能否在本场景沿用。
  mostly_note: 不要求跨样本复证；给出可判断的适用边界即可。
- rule_id: F-PRACTICAL-IMPLICATIONS-V1
  version: V1
  dimension_id: F
  dimension_name: 透明度、边界与实践意义
  indicator_name: 实践启示具体
  definition: 判断论文是否提供对管理者、组织、政策或实践者具体、有操作性的启示。
  required_evidence: 需要定位到实践启示、管理启示、政策建议或组织实践建议的原文片段。
  evidence_location:
  - Discussion
  - Practical Implications
  - Conclusion
  observation_points:
  - 是否超越重复理论含义
  - 是否说明具体行动对象
  - 是否说明如何改善实践
  - 是否与研究发现直接相关
  judgement_values:
    satisfied: 启示摆出可选做法之间的取舍，说明一种做法在什么条件下胜过另一种，实践者能据此在自身约束下选一条
    mostly: 启示落到具体对象与条件，指出谁在什么情形下可据此调整做法，而非重述研究结论
    partial: 提到实践意义但停在方向层面，未说明适用于谁或需要何种条件，读者难以把它转成行动判断
    weak: 启示与本文结果关联松散，多为一般性管理劝告，实践者读后不知该改变哪一项做法
    not_satisfied: 全文未涉及研究发现对实践者的含义，讨论止于理论层面
    uncertain: 解析缺失、候选证据过窄，或研究范式不适用，无法稳定判断
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
