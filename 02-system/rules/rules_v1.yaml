- rule_id: C-REASONING-RIGOR-V1
  version: V1
  dimension_id: C
  dimension_name: "Theoretical rigor and hypothetical logic"
  indicator_name: "The reasoning process is rigorous"
  definition: "Determine whether the reasoning chain of the paper from theory, literature or data to propositions/hypotheses/findings is complete, clear, and without obvious jumps."
  required_evidence: "needs to locate the core reasoning paragraph, proposition derivation, inductive discovery explanation or theoretical model explanation."
  evidence_location:
