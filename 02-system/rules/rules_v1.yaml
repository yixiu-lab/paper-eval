  threshold: "Key values ​​or coding results can be located around each core question, and the presentation is presented in a way that readers can check without having to make their own calculations."
  mostly_threshold: "At least one key result of each core question is shown in the text or a table. Individual analyzes only give directions or point to other tables, and readers can still check the conclusions after comparison."
