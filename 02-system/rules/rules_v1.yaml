  - robustness
  - we cannot rule out
  rationale: "Only determines whether the conclusion exceeds the limit of evidence, not whether a boundary paragraph has been written. The five grades are in descending order of the degree of transgression: self-confessed tension, no transgression, individual transgression, multiple transgression, and conflict with the results. Transgression will directly amplify the lack of evidence in the previous places."
  threshold: "Every causal or generalized statement in the conclusion can refer back to the same strength of support in the result part, and there are also active explanations of conflicting or unconfirmed evidence in the text."
  mostly_threshold: "The conclusion is consistent with the results as a whole, and some words are slightly stronger than the evidence, but it does not change the direction and scope of application of the conclusion."
- rule_id: E-DISCUSSION-SYNTHESIS-V1
  version: V1
  dimension_id: E
  dimension_name: "Credibility of evidence, results and conclusions"
  indicator_name: "Discussion part of theoretical synthesis"
  definition: "Determine whether the discussion integrates the results, returns to the original theoretical motivation, and forms a clear theoretical advancement."
  required_evidence: "It is necessary to cite the excerpts from the discussion that return to the theoretical puzzle, comprehensive findings, and explain the theoretical advance."
  evidence_location:
  - Discussion
  observation_points:
  - "Whether to return to the original theoretical motivation"
  - "whether to answer so what"
  - "Whether to integrate findings into a unified narrative"
  - "Does it explain the changes to the existing theory?"
  judgement_values:
    satisfied: "Discussion provides a mechanism or process explanation for the main results of this article, explaining why the results appear in this way. Readers can identify where this explanation rewrites the existing statement."
    mostly: "Discuss and explain what is more in this article compared to the existing understanding. This statement is supported by the results of this article. Readers can repeat this sentence without having to generalize on their own."
    partial: "The discussion retells the results and mentions the significance, but the advancement point is vague or loosely connected with the results. Readers can only summarize the theoretical increments themselves."
    weak: "The discussion lists the findings followed by a statement of their significance, without explaining what is more than the existing research, and the theory and results are disconnected from each other."
    not_satisfied: "There is no substantive discussion, or the content of the discussion is irrelevant to the results, and the discovery remains at a list without forming any judgment."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 3.0
  applicable_type: "General"
  source_reference:
  - Geletkanycz & Tepper 2012
  - Grant & Pollock 2011
  status: active
  cluster: E-DISCUSSION
  retrieval_terms:
  - discussion
  - theoretical implications
  - we contribute
  - our findings suggest
  - theoretical contribution
  - extend theory
  - theoretical lens
  - mechanism
  - in sum
  - advance
  rationale: "The only rule for judging the increment of knowledge in the E dimension depends on how the discussion explains the results, regardless of whether it restates the contribution. The fifth level is in descending order of the degree of overlap between the explanation and the results: mechanism explanation, incremental explanation, vagueness, disjointedness, and lack of judgment. Without these, the whole text will just stop at reciting the results."
  threshold: "An explanation that can identify a mechanism or process in the discussion. This explanation explains why the results of this article appear in this way. The basis can be identified in the text."
  mostly_threshold: "There is a propulsive statement supported by the results of this article in the discussion. It clearly explains what is more than the existing understanding of this article, and readers can directly repeat it."
  mostly_note: "does not require discussion to open up a new research agenda; it is enough to clearly explain a point of advancement."
- rule_id: F-REPRODUCIBILITY-V1
  version: V1
  dimension_id: F
  dimension_name: "Transparency, Boundaries and Practical Significance"
  indicator_name: "Program reproducibility"
  definition: "Determine whether the paper provides sufficient information to enable others to understand and reproduce the research procedures, data processing, and analysis processes."
  required_evidence: "It is necessary to cite the research procedures, data processing, analysis steps, parameters, materials or appendices."
  evidence_location:
  - Methods
  - Appendix
  - Supplementary Materials
  observation_points:
  - "Is the program structured?"
  - "Are data processing decisions transparent?"
  - "Whether the analysis steps can be followed"
  - "Whether necessary parameters or materials are provided?"
  judgement_values:
    mostly: "The methods section provides sample inclusion, variable construction and analysis steps. Readers can follow the main analysis without having to decide any step by themselves."
    partial: "The main links are described. Some aspects, such as sampling methods or analysis parameters, require readers to make their own decisions before proceeding. There will be bifurcations when re-starting."
    weak: "only explains the analysis framework and variable names. Sample inclusion and key parameters are missing. Readers can understand the ideas but cannot follow them to complete the same analysis."
    not_satisfied: "There is basically no explanation of the research procedure, or the key steps are contrary to the norms of the genre, and the reader cannot go back to the main analysis based on this"
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 1.0
  applicable_type: "General"
  source_reference:
  - "Zhang Kai et al. 2023"
  - Zhang & Shaw 2012
  status: active
  cluster: F-REPRO-TRANSPARENCY
  retrieval_terms:
  - procedure
  - data collection
  - analysis steps
  - coding
  - variable construction
  - measures
  - sample selection
  - replication
  - estimation procedure
  - supplementary materials
  rationale: "Determine whether the main analysis can be repeated according to the description, replacing the original public data requirements. The five levels are in descending order of what can be done: you can do it, you need to make up one step yourself, you only have the framework, and you can't repeat it. Non-disclosure of data does not affect this judgment."
  threshold: "The equivalent analysis steps and key parameters can be written in the method section alone, and there are no processing decisions that the reader needs to make up in the middle."
  mostly_threshold: "The method section explains the sample inclusion, variable construction and analysis steps. Readers can follow the description to repeat the main analysis; individual parameters or processing decisions need to be inferred."
  mostly_note: "does not require public data or step-by-step scripts; the process is written so that readers can re-walk the main analysis."
- rule_id: F-DATA-CODE-TRANSPARENCY-V1
  version: V1
  dimension_id: F
  dimension_name: "Transparency, Boundaries and Practical Significance"
  indicator_name: "Data, code and material transparency"
  definition: "Determine whether the paper addresses the availability of data, codes, scales, interview materials, codebooks, or supplementary materials."
  required_evidence: "needs to locate data availability, code links, material descriptions, appendices, or public repository information."
  evidence_location:
  - Methods
  - Data Availability
  - Appendix
  - Supplementary Materials
  observation_points:
  - "Does it indicate whether the data is public?"
  - "Whether code or analysis materials are provided?"
  - "Do you provide scales/interview outlines/codebooks?"
  - "Whether to explain the reason when not making it public"
  judgement_values:
    mostly: "There is a sentence in the article that explains how to obtain the core data, code or materials, so that readers can actually get it, or clearly explains the constraints that cannot be shared."
    partial: "provides scale entries, task materials or part of the appendices. The acquisition status of core data or codes has not yet been explained. Readers can only obtain peripheral materials."
    weak: "only mentions that the data comes from a certain institution or a certain platform, but does not explain whether it can be obtained again. Readers do not know whether the material is available to the outside world."
    not_satisfied: "The full text does not mention the availability of data, code or materials. Readers have no way to judge whether they can obtain it or to review it."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 1.0
  applicable_type: "General"
  source_reference:
  - "Zhang Kai et al. 2023"
  - Zhang & Shaw 2012
  status: active
  cluster: F-REPRO-TRANSPARENCY
  retrieval_terms:
  - data availability
  - code availability
  - available upon request
  - replication package
  - open data
  - open materials
  - repository
  - survey instrument
  - coding scheme
  - ethical approval
  rationale: "and reproducible division of labor: The one depends on whether the process is detailed enough, and the other depends on whether the materials can be obtained. The five levels are in descending order of availability: available, peripheral only, source only, not mentioned, and not based on whether it is truly open to the public."
  threshold: "There should be at least one place in the text describing the acquisition status of core data, code or materials, including the reasons for non-disclosure or application methods."
  mostly_threshold: "The main text explains whether the core data or code can be obtained and how to obtain it, or explains the constraints and alternative materials that cannot be shared."
  mostly_note: "does not require the data to be truly disclosed; just state the acquisition status (including reasons for non-disclosure or application methods)."
- rule_id: F-LIMITATIONS-V1
  version: V1
  dimension_id: F
  dimension_name: "Transparency, Boundaries and Practical Significance"
  indicator_name: "Limitations Discussion Honest and Specific"
  definition: "Judge whether the paper honestly discusses study limitations and relates the limitations to design, data, methods, or theoretical boundaries."
  required_evidence: "A description of the study limitations, potential weaknesses, open questions, or future research of the cited paper is required."
  evidence_location:
  - Discussion
  - Limitations
  - Conclusion
  observation_points:
  - "Whether design or data weaknesses are acknowledged"
  - "Whether to explain the impact of restrictions on interpretation"
  - "Whether to avoid the limitations of templates"
  - "Is future research specifically valuable?"
  judgement_values:
    mostly: "The author takes the initiative to point out the weakness that most affects the conclusion, and explains what kind of inference and scope of application it limits. Readers can draw conclusions based on this and leave discounts."
    partial: "has limited paragraphs, and the entries are either minor or template-oriented. The weaknesses that most affect the conclusion are only mentioned briefly. Readers still need to estimate their impact by themselves."
    weak: "The limited paragraph only lists general items such as sample size and future research. It does not touch on the most critical weakness of this article. The reader cannot see where the conclusion is most fragile."
    not_satisfied: "does not discuss its own weaknesses in the full text. Readers can only speculate on the aspects in which the conclusion may not be valid."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 1.0
  applicable_type: "General"
  source_reference:
  - Geletkanycz & Tepper 2012
  - Zhang & Shaw 2012
  - "Zhang Kai et al. 2023"
  status: active
  cluster: F-LIMITATIONS
  retrieval_terms:
  - limitations
  - limitation
  - future research
  - future studies
  - caveat
  - generalizability
  - sample
  - weaknesses
  - cannot rule out
  - avenues for future research
  - design limitations
  rationale: "determines whether the author consciously defines the usable scope of his own output, which is complementary to the conclusion rules: this one depends on the author's consciousness, and that one depends on the text actually crossing the boundary. The fifth level is in descending order of consciousness, and the most critical weakness must be touched before it is enough."
  threshold: "The limitations paragraph names a specific weakness and explains which types of conclusions or types of situations it limits its use."
  mostly_threshold: "The limitation paragraph points out the weakness that most affects the conclusion and explains what kind of conclusion or situation it limits. The reader can discount the conclusion accordingly."
  mostly_note: "It is not required to exhaust all weaknesses; just touch on the most critical one and explain the impact."
- rule_id: F-EXTERNAL-VALIDITY-V1
  version: V1
  dimension_id: F
  dimension_name: "Transparency, Boundaries and Practical Significance"
  indicator_name: "External validity and scope of application"
  definition: "Determine the extent to which research conclusions can be generalized to other samples, time periods, organizations, industries, cultures, or contexts."
  required_evidence: "requires reference to sample boundaries, situational boundaries, generalization scope, or external validity discussion."
  evidence_location:
  - Methods
  - Discussion
  - Conclusion
  observation_points:
  - "Whether to explain the sample and situation restrictions?"
  - "Whether to discuss cross-time or cross-scenario applicability"
  - "Is there any evidence to support promotion?"
  - "Whether to avoid undue generalization"
  judgement_values:
    satisfied: "In addition to providing applicable boundaries, it also provides comparable evidence across samples, situations, or time. Readers can judge whether the conclusion needs to be revised based on the differences in their own scenarios."
    mostly: "Clearly explain to which objects, time and situations the conclusion applies, so that readers can judge whether it can be applied in their own scenarios."
    partial: "explains the sample and situation information, but does not put the information into the applicable scope of the conclusion. Readers need to infer how far the conclusion can go."
    weak: "only describes the composition of the sample but does not indicate the applicable scope of the conclusion. Readers still don't know whether the sample characteristics can be transferred to other organizations or periods."
    not_satisfied: "The research objects and situations are not explained, and the conclusions are presented in an unrestricted tone. Readers cannot judge whether they can be used in their own scenarios."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 1.0
  applicable_type: "General"
  source_reference:
  - "Zhang Kai et al. 2023"
  - Bono & McNamara 2011
  status: active
  cluster: F-EXTERNAL
  retrieval_terms:
  - external validity
  - generalizability
  - generalizable
  - sample boundary
  - context
  - boundary conditions
  - scope conditions
  - other settings
  - industry
  - cross-cultural
  - single country
  rationale: "Determine whether the conclusion can be moved to the reader's own scene. The five levels are in descending order of transferability: the premise is given, the boundary is given, the information does not fall into the boundary, only the sample description, and no explanation. The difference from the conclusion rules is explained in this scope."
  threshold: "The main text can limit the applicable objects, situations or time ranges, rather than just describing the composition of the sample."
  mostly_threshold: "The main text has statements that clearly limit the applicable objects, situations or time ranges, and readers can judge whether it can be used in this scenario."
  mostly_note: "does not require cross-sample re-certification; just provide a judgeable applicable boundary."
- rule_id: F-PRACTICAL-IMPLICATIONS-V1
  version: V1
  dimension_id: F
  dimension_name: "Transparency, Boundaries and Practical Significance"
  indicator_name: "Practical inspiration is concrete"
  definition: "Determine whether the paper provides specific and practical implications for managers, organizations, policies or practitioners."
  required_evidence: "It is necessary to locate the original text fragment of practical implications, management implications, policy suggestions or organizational practice suggestions.\nDoes"
  evidence_location:
  - Discussion
  - Practical Implications
  - Conclusion
  observation_points:
  - "transcend the theoretical meaning of repetition?"
  - "Whether to specify the specific target of the action?"
  - "Does it describe how to improve practice?\nIs"
  - "directly related to the research findings?"
  judgement_values:
    satisfied: "Enlightenment lays out the trade-offs between alternative approaches, explaining under what conditions one approach is better than another, so that practitioners can choose one under their own constraints"
    mostly: "The inspiration falls on specific objects and conditions, pointing out who and under what circumstances can adjust their practices accordingly, rather than restating the research conclusions."
    partial: "mentions practical significance but stops at the direction level. It does not explain who it applies to or what conditions are required. It is difficult for readers to turn it into action judgment."
    weak: "Enlightenments are loosely related to the results of this article and are mostly general management advice. Practitioners do not know which practice to change after reading it."
    not_satisfied: "The full text does not cover the implications of the research findings for practitioners, and the discussion is limited to the theoretical level."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 1.0
  applicable_type: "General"
  source_reference:
  - Tihanyi 2020
  - Colquitt & George 2011
  - Geletkanycz & Tepper 2012
  status: active
  cluster: F-PRACTICAL
  retrieval_terms:
  - practical implications
  - managerial implications
  - practitioners
  - managers
  - organizations
  - policy implications
  - recommendations
  - decision making
  - human resource
  - actionable
  - trade-offs
  rationale: "determines whether the output can be taken over by the practical party. The fifth level is in descending order of acceptability: giving comparable options, specifying objects and conditions, stopping in the direction, loose connection, and no involvement. Most management papers can hit the target, so the middle grades can still be divided."
  threshold: "The revelation paragraph specifies the beneficiary and applicable conditions. This approach has a clear relationship with the results of this article, rather than restating the conclusion."
  mostly_threshold: "The revelation paragraph indicates who can adjust their practices accordingly under what circumstances, and this practice has a clear relationship with the results of this article."
- rule_id: F-SOCIAL-LONGTERM-IMPACT-V1
  version: V1
  dimension_id: F
  dimension_name: "Transparency, Boundaries and Practical Significance"
  indicator_name: "Social or long-term impact"
  definition: "Determine whether the paper focuses on the impact of individual, group, social welfare or long-term responsible management practices inside and outside the organization."
  required_evidence: "The paper needs to be cited with a description of social issues, long-term impacts, responsible management or social welfare."
  evidence_location:
  - Introduction
  - Discussion
  - Conclusion
  observation_points:
  - "Whether to respond to major social issues"
  - "Whether to consider long-term social welfare"
  - "Are you concerned about the external impact of the organization?"
  - "Whether to avoid emphasizing only short-term performance"
  judgement_values:
    satisfied: "discusses the long-term or social consequences of the research object, indicating which types of subjects are affected and at what time scale. This discussion continues from the evidence in this article."
    mostly: "The main text describes the long-term or social-level consequences, which are based on the results of this article, but the affected subjects and time scales are read in general terms."
    partial: "only mentions social or long-term impacts in the introduction or at the end, and has no connection with the evidence of this article. It is a rhetorical statement."
    weak: "points to the direction of impact but does not explain which types of subjects are involved and what time scale is involved. Readers cannot form a substantive judgment on the consequences based on this."
    not_satisfied: "The full text does not cover the long-term or social consequences of the research phenomenon, and readers cannot find content on which to judge the scope of the impact."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 0.0
  applicable_type: "General"
  source_reference:
  - Tihanyi 2020
