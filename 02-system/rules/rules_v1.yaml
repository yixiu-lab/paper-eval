rules:
- rule_id: A-TOPIC-SIGNIFICANCE-V1
  version: V1
  dimension_id: A
  dimension_name: "Topic selection value and problem positioning"
  indicator_name: "Importance of research question"
  definition: "Determine whether the paper demonstrates that the research question is important at a theoretical, practical or social level, rather than just filling in a small gap."
  required_evidence: "You need to be able to locate the original text fragment of the paper that explains why the issue is important and worthy of study."
  evidence_location:
  - Abstract
  - Introduction
  - Motivation
  observation_points:
  - "point to important theoretical issues or practical issues?"
  - "Does it state the objects and scope affected by the problem?"
  - "Whether to rely only on a lack of prior research as the main justification."
  - "reflect the combination of rigor and relevance?"
  judgement_values:
    mostly: "Point out what identifiable consequences the problem will have in theory or practice if it is not solved. Readers can see the objects and magnitude of the impact, rather than just being told that the problem is important."
    partial: "explains the importance of the issue and points out the affected objects, but the consequences are only mentioned to the extent that they are related to the development of a certain field. Readers can barely see the value, and the loss content has not been explained."
    weak: "Only uses research intensity, policy formulation or the number of documents to indicate importance. Readers cannot find unsolved consequences and affected objects. The value of the problem is supported by the weight of the subject matter. It is difficult to take the conclusion seriously based on this."
    not_satisfied: "This element is missing: the paper does not substantively position the importance of the problem, or equates the importance with the lack of relevant research and other reasons that have nothing to do with value."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm does not enter the problem with a statement of importance, so this item lacks text to rely on."
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 3.0
  applicable_type: "General"
  source_reference:
  - Colquitt & George 2011
  - Grant & Pollock 2011
  - Tihanyi 2020
  status: active
  cluster: A-TOPIC
  retrieval_terms:
  - important
  - significance
  - pressing problem
  - practical relevance
  - theoretical relevance
  - consequences
  - organizations
  - society
  - policy
  - research gap
  - motivation
  - this study addresses
  rationale: "Distinguish between statements of importance and explanations of consequences. The qualifying line is that readers can identify the consequences and affected objects; only stating an important position is partial, relying only on popularity or mentioning to support it, which is weak; not talking about value or only citing lack of research as an excuse. Top journal-level major issues are handled by top_journal_gate."
  threshold: "The abstract or introduction contains the original text explaining the specific consequences of not solving the problem. Readers can identify the affected objects and where the losses fall."
  mostly_threshold: "There is a sentence in the abstract or introduction that explains the consequences of not solving the problem, and the reader can identify the affected objects."
- rule_id: A-GAP-PUZZLE-V1
  version: V1
  dimension_id: A
  dimension_name: "Topic selection value and problem positioning"
  indicator_name: "Research Gap / Puzzle Clarity"
  definition: "Determine whether the paper clearly points out existing research deficiencies, theoretical contradictions, empirical anomalies, puzzles, or important unanswered questions."
  required_evidence: "Requires citation of original textual evidence regarding gaps, puzzles, paradoxes, breakdowns, inadequacy, or research gaps."
  evidence_location:
  - Introduction
  - Literature Review
  observation_points:
  - "Does it explain what is known from existing research?"
  - "Does it point out what you don't know or what you can't explain?\nIs"
  - "gap directly related to the research question?"
  - "Whether to avoid general claims that \"there is no research yet\""
  judgement_values:
    satisfied: "The gap has narrowed to a specific unsolved item that can be directly responded to by the conditions of this article. Readers can see which step this article has added, and what kind of explanation will become invalid after this step is completed."
    mostly: "Point out the specific content that cannot be explained or has not been dealt with by existing research. The scope of the gap can be positively responded to by this article. Readers can tell which conversation this article is connected to."
    partial: "mentioned gaps in the literature or contradictory conclusions. The boundaries of the gaps are wide. Papers on the same topic can all claim to be filling them. Readers can see the direction of the response, but the landing point is still uncertain."
    weak: "The gap appears as the saying that there are still few such studies. Readers cannot see what is missing in the existing research. The relationship between this article and the theoretical dialogue is suspended, and the proposition of advancement is untenable."
    not_satisfied: "This element is missing: the introduction does not indicate what the existing research lacks or cannot explain, or equates the gap with the lack of such research and is irrelevant to the theoretical dialogue."
    uncertain: "There is a lack of analysis, the candidate evidence is too narrow, or the research paradigm does not use gaps to locate the problem, so this item lacks text that can be relied upon."
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 3.0
  applicable_type: "General"
  source_reference:
  - Grant & Pollock 2011
  - Hollenbeck 2008
  - Colquitt & George 2011
  status: active
  cluster: A-GAP
  retrieval_terms:
  - research gap
  - gap in the literature
  - puzzle
  - paradox
  - conflicting findings
  - little is known
  - unresolved
  - overlooked
  - has not been examined
  - prior research
  - extend prior work
  rationale: "distinguishes between mentioned gaps and defined gaps. The qualifying line is that the gap is narrow enough to respond to the conditions of this article; the boundary is wide and partial, which means there is little research and weak; there is no missing gap. The paradox-level puzzle is handled by top_journal_gate."
  threshold: "There is a paragraph in the introduction that explains what existing research already knows and what remains unresolved. The unresolved issues can be directly responded to by the data or arguments in this article."
  mostly_threshold: "The introduction points out a content that has not been dealt with or cannot be explained by existing research. The reader can identify which item this article continues."
- rule_id: A-QUESTION-CLARITY-V1
  version: V1
  dimension_id: A
  dimension_name: "Topic selection value and problem positioning"
  indicator_name: "Research objects and research questions are clear"
  definition: "Determine whether the paper clearly states the research object, core questions, research objectives or hypothesis testing objects."
  required_evidence: "Original text fragments that can locate the research object, research questions, research objectives or core hypotheses are required."
  evidence_location:
  - Abstract
  - Introduction
  observation_points:
  - "Whether the research object is identifiable"
  - "Is the research question specific?"
  - "Is the research goal executable?"
  - "Whether the problem, object, and goal correspond to each other?"
  judgement_values:
    mostly: "The research question falls on a specific object, relationship or process. Readers can tell what results support it and what results overturn it. The problem boundary is therefore identifiable."
    partial: "The research direction is clear, the objects can be identified, the test conditions are still unclear, and various results can be counted as answers. The reader cannot be sure what this article is trying to prove, and the derivation lacks a landing point."
    weak: "Only the research topic or research object is given. The reader cannot see which relationship is to be tested. The problem is never narrowed in the subsequent derivation, and the conclusion returns to a general statement."
    not_satisfied: "This element is missing: no identifiable research question can be found in the full text, or the statement of the question is inconsistent with the analysis content actually performed in the paper, and the reader cannot be sure what the article is answering."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm does not organize the full text with testable questions, so this item lacks text that can be relied upon."
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 3.0
  applicable_type: "General"
  source_reference:
  - "Zhang Kai et al. 2023"
  - Bono & McNamara 2011
  - Grant & Pollock 2011
  status: active
  cluster: A-QUESTION
  retrieval_terms:
  - research question
  - we examine
  - this study investigates
  - research objective
  - hypotheses
  - research model
  - we test
  - the purpose of this study
  - focal construct
  - dependent variable
  - theoretical model
  rationale: "The key to restoring distinction in the A dimension: clearly upgrade the problem to a question that can be falsified. The qualifying line is that the reader can preset the falsification conditions; the object is specific but the test conditions are unclear, partial, leaving only the theme weak; no identifiable problems are missing."
  threshold: "The research question given in the abstract or introduction contains specific objects and relationships, and the reader can imagine an observation that would deny it."
  mostly_threshold: "The abstract or introduction can identify the relationship between the research object and the question asked, and the reader can tell what the question intends to prove."
- rule_id: A-LITERATURE-POSITIONING-V1
  version: V1
  dimension_id: A
  dimension_name: "Topic selection value and problem positioning"
  indicator_name: "Document dialogue positioning"
  definition: "Determine whether the paper places the research into a clear academic dialogue and explains its relationship to existing theories, findings, or controversies."
  required_evidence: "It is necessary to cite the paper's positioning description of existing literature, theoretical lines, controversies or consensus."
  evidence_location:
  - Introduction
  - Literature Review
  - Theory
  observation_points:
  - "Does it explain the relevant theoretical perspective?"
  - "Whether to explain the relationship with existing findings"
  - "Whether to avoid stacking references only"
  - "Is it clear to pave the way for subsequent contributions?"
  judgement_values:
    satisfied: "Put this article into an ongoing debate, point out what each side holds, and which side the article is on. Readers can see which existing explanations will become invalid if they do not take this step."
    mostly: "Explain which theoretical line or debate this article follows. Readers can see whether this article is a continuation, limitation or rewriting of the existing conclusions."
    partial: "The review covers relevant literature, but only goes to the research field level. Readers can see the scope of the conversation, but cannot recognize which route or side this article is on, making it difficult to align its contributions."
    weak: "Documents appear in sections according to topics. Readers cannot see the trade-off relationship between this article and any existing conclusions. The dialogue objects are always blurred, and the contribution claims lack a comparable frame of reference."
    not_satisfied: "This element is missing: the literature only appears in the form of a list, the reader cannot see the relationship between this article and any existing theoretical line, or the paper does not put itself into the existing dialogue"
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the paper is an emerging topic and the existing dialogue has not yet taken shape, so this item lacks text to base on."
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 3.0
  applicable_type: "General"
  source_reference:
  - Sparrowe & Mayer 2011
  - Grant & Pollock 2011
  - Hollenbeck 2008
  status: active
  cluster: A-LIT
  retrieval_terms:
  - literature review
  - prior research
  - theoretical perspective
  - stream of research
  - conversation
  - debate
  - divergent findings
  - building on
  - extends the literature
  - research tradition
  - seminal work
  rationale: "and A-GAP: this one asks about the conversation partner and position, and the gap one asks where the unknown item is. The qualifying line refers to identifying the route or debate; only going to the field level is partial, and only listing by topic is weak; there is no dialogue missing."
  threshold: "The introduction or theoretical part points out the theoretical line to which this article belongs or the debate it joins, and the reader can tell who is the other party in the dialogue."
  mostly_threshold: "A statement appears in the introduction or theory section that connects this article to an existing theoretical line or a debate."
- rule_id: A-SCOPE-ACTIONABILITY-V1
  version: V1
  dimension_id: A
  dimension_name: "Topic selection value and problem positioning"
  indicator_name: "Problem scope and operability"
  definition: "Determine whether the research scope is sufficient to support meaningful contributions, and whether the problem setting is researchable, analyzable, and implementable."
  required_evidence: "It is necessary to locate the paper's description of the research scope, construct boundaries, research scenarios or operational research paths.\nIs the"
  evidence_location:
  - Introduction
  - Theory
  - Methods
  observation_points:
  - "range too narrow or the data slices too thin?"
  - "Whether key constructs, mechanisms or situations are covered\nCan"
  - "be responded to by the research design?"
  - "Whether it can generate concrete practical or theoretical insights"
  judgement_values:
    mostly: "The research scope is to the extent that it can be fully responded to by the data and design of this article. Questions outside the scope are clearly excluded. Readers will not expect this article to answer questions that it is not qualified to answer."
    partial: "The scope is clearly explained, but there are still expectations beyond the design capabilities. Readers can roughly see what this article can answer. It is still uncertain whether the constructs or situations claimed to be covered have been touched by the data."
    weak: "The scope is so wide that no single study can answer all the questions. The design scale is obviously misaligned with the declared scope. Readers cannot judge which part of the conclusions are supported by data, thus reducing credibility."
    not_satisfied: "This element is missing: the scope is too broad to be responded to by any single study, or the content claimed to be covered by the paper is inconsistent with the scope that its data can actually cover."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the paper genre does not declare the operable scope, so this item lacks text to rely on.\nDivision of work between"
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 3.0
  applicable_type: "General"
  source_reference:
  - Colquitt & George 2011
  - Tihanyi 2020
  status: active
  cluster: A-SCOPE
  retrieval_terms:
  - scope
  - boundary conditions
  - research setting
  - context
  - unit of analysis
  - level of analysis
  - generalizability
  - theoretical model
  - empirical setting
  - research design
  - limitations
  rationale: "and A-QUESTION: whether the scope of this question can be answered by this article, and whether the question can be falsified. The qualification line is that the scope is aligned with the design capabilities; there is overflow left to be partial, the scope and data are misaligned and weak; claims that are contrary to the facts are missing."
  threshold: "The method or introduction explains the scope of the research and the boundaries of the data. Readers can identify relevant issues that are explicitly excluded from this article."
  mostly_threshold: "The method or introduction describes the scope of the study and the boundaries of the data, and the reader can see that the scope is generally aligned with its design capabilities."
- rule_id: B-THEORY-INTEGRATION-V1
  version: V1
  dimension_id: B
  dimension_name: "Theoretical contribution and innovation"
  indicator_name: "Cross-theoretical or cross-disciplinary integration"
  definition: "Determine whether the paper connects two or more theoretical perspectives to the same phenomenon. Empirical papers are usually based on a single framework, and this rule does not apply to them."
  required_evidence: "An explanation of theoretical sources, differences in assumptions, means of integration, compatibility, or theoretical intersections is required."
  evidence_location:
  - Theory
  - Literature Review
  - Discussion
  observation_points:
  - "Do you explain why multiple theories are needed?"
  - "Is the difference in theoretical assumptions clear?"
  - "Is the treatment of epistemology/hierarchy/human nature assumptions compatible?\nIs"
  - "not a simple splicing theory?"
  judgement_values:
    satisfied: "The division of labor in the integration is written to a verifiable level: readers can directly point out which part of the explanation the two perspectives are responsible for, and what new explanations are added after the integration, without the need to splice them together by themselves."
    mostly: "Connect different theoretical perspectives to the same phenomenon and explain which part each is responsible for explaining. Readers can see that after integration, explanations cannot be given by a single perspective."
    partial: "uses multiple theoretical perspectives to explain different fragments. Readers can see that they are put into the same paper, but they cannot see where the intersection occurs. It is unclear what is extra."
    weak: "Multiple perspectives are cited one after another only as background or source of variables, and do not constitute an explanatory relationship with each other. The theoretical part is more like a multi-perspective review, and the contribution claims lack integrated support."
    not_satisfied: "This element is missing: only a single theoretical perspective is used, or multiple perspectives are only cited one after another without any explanatory relationship between them."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the paper is based on a single perspective without integration, so this item lacks text to rely on."
  score_mapping:
    satisfied: 1.0
    mostly: 0.5
    partial: 0.25
    weak: 0.0
    not_satisfied: 0.0
    uncertain: null
  role: bonus
  weight: 4.444444
  applicable_type: "Theory/Review/Hybrid"
  source_reference:
  - Shaw et al. 2018
  - Sparrowe & Mayer 2011
  - Nadkarni et al. 2018
  status: active
  cluster: B-INTEGRATION
  retrieval_terms:
  - theoretical integration
  - multiple theoretical perspectives
  - integrate
  - complementary
  - cross-disciplinary
  - organizational theory
  - behavioral theory
  - draws on
  - combines
  - theoretical lens
  - interdisciplinary
  rationale: "The qualifying line is when two perspectives have a discernible division of explanatory labor on the same phenomenon, and does not require epistemological compatibility of treatments. Each uses a non-intersecting partial, which is only used as a background reference and is weak; the single-view angle is missing. Deep interdisciplinary integration is undertaken by top_journal_gate."
  threshold: "Two or more perspectives appear in the theoretical part. At least one sentence explains how they divide work on the same phenomenon, and readers can identify the intersection."
  mostly_threshold: "Two perspectives appear in the theoretical section, and the reader can tell which part of the phenomenon they each explain."
- rule_id: B-CONCEPT-MECHANISM-NOVELTY-V1
  version: V1
  dimension_id: B
  dimension_name: "Theoretical contribution and innovation"
  indicator_name: "New concepts, new mechanisms or theoretical propositions"
  definition: "Determine whether the paper proposes new conceptual structures, mechanistic explanations, theoretical propositions, or causal structures, rather than merely reporting empirical relationships."
  required_evidence: "Need to locate original text evidence of new concepts, mechanisms, models, propositions or theoretical structures."
  evidence_location:
  - Theory
  - Findings
  - Discussion
  observation_points:
  - "Whether it rises from phenomenon to concept"
  - "Does it propose an interpretable mechanism?"
  - "Whether to construct new causal or process structures"
  - "Whether to avoid stopping at descriptive findings"
  judgement_values:
    mostly: "Propose an identifiable new mechanism, new construct or new measurement method, and provide evidence or arguments that can distinguish this new content from existing explanations"
    partial: "There is a new formulation or new measurement. The explanation is different from the existing explanation only to the extent that it is more detailed and more suitable for the situation. The essence of the change is still unclear."
    weak: "The new formulation basically changes the name of the existing construct. Readers can understand the results according to the original explanation. The new content cannot be identified, so the innovative claim is untenable."
    not_satisfied: "This element is missing: the paper follows the existing constructs and mechanisms, or the new formulation just changes the name without any identifiable explanation difference."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the paper belongs to a genre such as replication testing that does not target new mechanisms, so this item lacks text to base on.\nAfter"
  score_mapping:
    mostly: 1.0
    partial: 1.0
    weak: 0.5
    not_satisfied: 0.0
    uncertain: null
  role: baseline
  weight: 5.538461
  applicable_type: "General"
  source_reference:
  - Nadkarni et al. 2018
  - Bansal et al. 2018
  - "Zhang Kai et al. 2023"
  status: active
  cluster: B-NOVELTY
  retrieval_terms:
  - new construct
  - novel mechanism
  - theoretical contribution
  - we develop
  - we propose
  - conceptual model
  - reconceptualize
  - mechanism
  - theory building
  - extends theory
  - proposition
  rationale: "calibration, this identification and measurement path and mechanism are refined. It does not require a complete theoretical system and covers common contribution forms of method-based and AI application-based papers. The difference is unclear and partial, and the name is changed to weak; the existing one is used."
  threshold: "The theory or discussion section presents a new mechanism, new construct or new measurement path, and at least one explanation of its difference from existing explanations."
  mostly_threshold: "The theory or discussion section proposes a new mechanism, new construct or new measurement approach, and readers can tell how it is different from existing explanations."
- rule_id: B-INTERESTINGNESS-V1
  version: V1
  dimension_id: B
  dimension_name: "Theoretical contribution and innovation"
  indicator_name: "Interesting and counter-intuitive insights"
  definition: "Determine whether the paper provides insights that are counterintuitive, re-see phenomena, or reveal hidden relationships, and avoid sacrificing reliability for the sake of interest."
  required_evidence: "It is necessary to cite the original evidence of how the paper refutes, reverses, reinterprets or reveals the existing knowledge."
  evidence_location:
  - Introduction
  - Theory
  - Discussion
  observation_points:
  - "Does it present insights that appear to be X but are not X?\nDoes"
  - "reveal unexpected relationships or mechanisms?\nIs"
  - "connected to important issues?"
  - "Whether to avoid HARKing or fragile complex models"
  judgement_values:
    satisfied: "The source of tension and the reasons for the failure of the original explanation are written in detail: the reader can directly point out which ignored mechanism is at work, and at which step the original explanation does not hold."
    mostly: "presents a discovery that is different from intuition or existing conclusions, explaining where the tension comes from, and readers can see why the original explanation does not hold."
    partial: "The results are novel, and the direction still falls within the existing expected range. Readers can see that this article wants to give a sense of surprise. It is still unclear whether the source of tension and the original explanation have been overturned."
    weak: "The results are consistent with the expected direction, but the discussion uses counterintuition as a selling point. Readers cannot see the evidence to support the statement, and the interesting claim weakens the credibility of the conclusion."
    not_satisfied: "This element is missing: the results are in the same direction as the existing expectations, or the paper uses counterintuition as a selling point but cannot provide evidence that is contrary to the expectations."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the paper is in a genre such as replication or method testing that does not aim at unexpected discoveries, so this item lacks text to base on."
