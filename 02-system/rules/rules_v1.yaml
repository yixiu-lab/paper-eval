  - alternative specification
  - sensitivity analysis
  - additional analysis
  - alternative measure
  - subsample
  - falsification test
  - control variables
  - placebo
  - results hold
  rationale: "To determine whether the test falls on the weakest link of the conclusion, the number of tests is not counted. The five levels are descending according to the focus: self-perceived weaknesses are tested, key points are tested, minor points are tested, routine actions are not tested, and the higher the conclusion, the more it can withstand the main challenges."
  threshold: "can point out that a test directly targets the weakest link recognized by the author himself. The settings and results of the test can be identified, and the author can use this to explain whether the main conclusion has changed."
  mostly_threshold: "At least one robustness or supplementary analysis falls on a critical link in the conclusion, and the results are reported in the text. Readers can see that the threat has been addressed according to the author's instructions."
  mostly_note: "It is not required to test every core relationship; the test only needs to fall on key links, and other secondary relationships can be omitted."
