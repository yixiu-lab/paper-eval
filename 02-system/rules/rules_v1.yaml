- rule_id: C-LOGIC-PREMISE-V1
  version: V1
  dimension_id: C
  dimension_name: "Theoretical rigor and hypothetical logic"
  indicator_name: "The logical premise is appropriate"
  definition: "Determine whether the factual premises, semantic premises and applicable premises on which the theoretical derivation relies are clear and reasonable."
  required_evidence: "It is necessary to cite the key premises, assumptions or applicable conditions in the theoretical derivation of the paper."
  evidence_location:
