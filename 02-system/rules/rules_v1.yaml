    mostly: "The main steps are explained. Some details that affect the review are missing or inconsistent. Readers need to guess how to handle a certain step."
    partial: "The main steps are explained. There are gaps or inconsistent statements in some links that affect the review. Readers need to guess how to handle this step."
    weak: "There are many ambiguities in the execution steps. The processing sequence of the main analysis cannot be reconstructed from the text. Readers can only accept the results based on the author's report."
    not_satisfied: "Key analysis steps are missing, or the execution method violates the basic norms of the genre, and readers cannot review the main analysis results reported in the paper."
    uncertain: "The analysis is missing or the candidate evidence is too narrow, or the paper belongs to a genre such as theory or commentary that does not use data to implement methods, and it is impossible to make a stable judgment."
