rule_profile_id: MGMT-LIT-EVAL-V1
rule_profile_name: Management Paper Evaluation Rules
version: current
status: active
scoring_scale: 100
scoring_pools:
  baseline: 60
  bonus: 40
evidence_budget:
  max_evidence_per_rule: 10
judgement_policy: >-
  Review agents return judgment tiers and evidence references. The Harness applies the declared weights and score mappings deterministically. The total score is the 60-point baseline pool multiplied by baseline attainment plus the 40-point bonus pool multiplied by bonus attainment. Dimension, construct, and rule weights must sum consistently. Each dimension uses a 60:40 baseline-to-bonus allocation so its maximum equals its declared weight. Baseline rules assess minimum publication readiness: mostly and partial each map to 1.0, weak to 0.5, and not_satisfied to 0.0; satisfied is not used for baseline rules. Bonus rules assess performance beyond the baseline: satisfied maps to 1.0, mostly to 0.5, partial to 0.25, and weak or not_satisfied to 0.0. Uncertain judgments are excluded from both numerator and denominator. The rule-level score_mapping is the source of truth.
dimensions:
- dimension_id: A
  dimension_name: "Topic selection value and problem positioning"
  weight: 15
  description: "Evaluate whether the paper raises issues worthy of research, clearly positioned, and capable of entering into effective academic dialogue."
