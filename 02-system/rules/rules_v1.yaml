  threshold: "The main text explains how the identification arrangement eliminates major alternative explanations and explains to what extent the threat is eliminated."
  mostly_threshold: "The main text explains the model setting and the identification arrangements for the main alternative explanations, or explains why the design does not cause identification problems."
- rule_id: D-METHOD-EXECUTION-V1
  version: V1
  dimension_id: D
  dimension_name: "Study design and methodological quality"
  indicator_name: "method execution specification"
  definition: "Determine whether the execution, analysis, and reporting of quantitative, qualitative, or mixed methods conform to appropriate research genre specifications."
