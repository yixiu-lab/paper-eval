  dimension_name: "Theoretical contribution and innovation"
  weight: 20.0
  description: "Evaluate whether the paper changes, challenges, integrates, or advances existing theoretical dialogue."
- dimension_id: C
  dimension_name: "Theoretical rigor and hypothetical logic"
  weight: 20.0
  description: "Evaluate whether concepts, logical premises, reasoning chains, assumptions or propositions are well constructed."
- dimension_id: D
  dimension_name: "Study design and methodological quality"
  weight: 25
  description: "Evaluate whether the research design, data, measurements, models, identification, and method execution support the research questions."
- dimension_id: E
  dimension_name: "Credibility of evidence, results and conclusions"
  weight: 15.0
