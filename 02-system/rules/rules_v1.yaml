  mostly_threshold: "The main text explains the data source and sample size, and the sample characteristics are sufficient for readers to judge its correspondence with the target population."
- rule_id: D-MEASUREMENT-VALIDITY-V1
  version: V1
  dimension_id: D
  dimension_name: "Study design and methodological quality"
  indicator_name: "Construct measurement and operationalization are effective"
  definition: "Determine whether variables, constructs, coding, or qualitative classifications accurately capture theoretical concepts and provide sufficient validity explanations."
  required_evidence: "Need to locate the measurement source, scale adaptation, coding rules, construct operationalization or validity test instructions."
  evidence_location:
  - Methods
  - Measures
  - Coding
  observation_points:
  - "Whether the measurement corresponds to the essence of the construct"
  - "Whether to indicate the source of the scale/item"
  - "Is the adaptation justified and evidence of validity?"
  - "Are encoding and aggregation decisions clear?"
  judgement_values:
    mostly: "The measurement scheme basically corresponds to the construct, but the validity reason is weak or the basis for adaptation is unclear. Readers still have doubts about whether the two are equivalent."
    partial: "The measurement or coding generally corresponds to the construct, but the validity basis is thin. Readers still have questions about whether the operationalization captures the essence of the construct."
    weak: "The operationalization only covers part of the connotation of the construct and is tenable on its own. However, the representativeness of the obtained results for the construct has been substantially weakened."
    not_satisfied: "The measurement or coding is misaligned with the connotation of the construct, or the operationalization method is contrary to the research question, and the obtained variables cannot represent the concept to be tested."
    uncertain: "The analysis is missing or the candidate evidence is too narrow, or the paper is in a genre such as theory or simulation that does not produce measurement operations, making it difficult to make a stable judgment."
  score_mapping:
    mostly: 1.0
    partial: 1.0
