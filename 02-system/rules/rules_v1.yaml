  threshold: "Any core question or hypothesis can point to at least one set of results that directly respond to it, and the response relationship is clearly identifiable in the text."
  mostly_threshold: "Most of the core questions have direct corresponding results and responses. Some questions are only covered side by side. The corresponding relationship here is provided by the readers themselves."
- rule_id: E-ROBUSTNESS-V1
  version: V1
  dimension_id: E
  dimension_name: "Credibility of evidence, results and conclusions"
  indicator_name: "Robustness and Supplementary Analysis"
  definition: "Determine whether the paper enhances the credibility of the results through robustness checks, supplementary analyses, alternative models, ablation or triangulation."
  required_evidence: "Original text fragments need to be cited for robustness tests, alternative models, supplementary analyses, ablation, or triangulation."
  evidence_location:
