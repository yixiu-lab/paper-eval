  - "Does the hypothesis test correspond item by item?"
  - "Discover whether to return to the theoretical model"
  - "Is there a disconnect between the results and the claims?"
  judgement_values:
    mostly: "If you take any core question or hypothesis, you can point out the results that directly respond to it. The corresponding relationship between the questions and the results can be discerned in the text."
    partial: "Most of the questions have results and responses, and some questions are only covered side by side. Here, it is up to the readers to connect the corresponding relationship between the questions and the results."
    weak: "The results corresponding to some questions are only marginally related. Readers need to judge whether the results are considered answers. The response relationship is therefore unstable."
    not_satisfied: "After the question is raised, the corresponding response cannot be found in the results, or the result of another question is replaced, and the reader cannot confirm whether the question has been answered."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
