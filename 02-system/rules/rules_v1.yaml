  - "Does the control variable have a theoretical basis?"
  - "Whether to deal with common method deviation"
  - "Whether to consider endogeneity or selection bias\nThe"
  judgement_values:
    mostly: "model and identification strategy are arranged for the main threats of this inference. Readers can see that the threats have been eliminated to the extent that they do not affect the conclusion."
    partial: "The identification arrangement only covers part of the threats, and other mechanisms that can also explain the obtained results have not been processed, so the inference strength is limited."
    weak: "The identification arrangements are mostly routine, the main alternative explanations are not dealt with in the text, and the causal tone is beyond the scope of what the evidence can support."
    not_satisfied: "The basis for model setting or identification is missing, the main alternative explanations have not been ruled out, and the resulting estimates ultimately cannot support the causal claims made in the paper."
    uncertain: "The analysis is missing or the candidate evidence is too narrow, or the paper is of a qualitative or theoretical nature that does not use statistical models, making it difficult to make a stable judgment."
