  - "Does the concept match the research question?"
  judgement_values:
    mostly: "Most of the core concepts clearly define the scope of covered and excluded phenomena. The boundaries between a few and adjacent constructs still need to be deduced by the reader from the context."
    partial: "The concept is defined, but the definition is too broad or the boundaries with adjacent constructs are blurred. Readers need to rely on the context to roughly determine the scope of the phenomenon it refers to."
