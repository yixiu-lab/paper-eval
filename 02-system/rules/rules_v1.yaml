- rule_id: E-RESULTS-ALIGNMENT-V1
  version: V1
  dimension_id: E
  dimension_name: "Credibility of evidence, results and conclusions"
  indicator_name: "Results correspond to questions/hypotheses"
  definition: "Determine whether the results presented directly respond to the research question, hypothesis, proposition or theoretical model."
  required_evidence: "It is necessary to locate the original evidence of how the results correspond to the research questions, hypotheses or theoretical claims."
  evidence_location:
