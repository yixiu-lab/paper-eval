  - "Is the semantics clear and consistent?"
  - "Whether the premise applies to the research question"
  judgement_values:
    satisfied: "The key premises provide the basis and applicable conditions one by one. The reader does not need to accept any of them to follow the derivation. Alternative premises outside the main line are also explained why they are not adopted."
    mostly: "Most of the key premises can be identified. The basis or scope of application of individual premises needs to be accepted by the reader. The main line of derivation is still tenable."
    partial: "The key premises are partially explained. Some premises have insufficient basis or vague scope of application. Readers still have doubts about their establishment, but this does not block subsequent derivation."
    weak: "Although the key premise can be pointed out, the author does not explain why it is true in this situation. Readers will doubt its reliability after considering the facts in this field."
    not_satisfied: "The premise on which the derivation relies has not been identified, or the premise is obviously not commensurate with the research phenomenon, causing subsequent theoretical claims to lose support from the beginning."
    uncertain: "The analysis is missing or the candidate evidence is too narrow, or the style of the paper does not rely on identifiable explicit premises, so there is no text to base the judgment on."
