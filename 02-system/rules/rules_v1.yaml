  dimension_id: B
  dimension_name: "Theoretical contribution and innovation"
  indicator_name: "Questioning, integrating and advancing existing cognitions"
  definition: "Determine whether the paper makes it clear what the paper advances by questioning a premise, integrating disagreements in the literature, or pointing out an increase relative to existing understanding. It is established if any one of the three paths is passed."
  required_evidence: "needs to locate the paper's description of change, challenge, advance, new direction or research agenda."
