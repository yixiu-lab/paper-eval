  judgement_values:
    satisfied: "Name your weakest point in the article and explain what kind of results will overturn the main conclusion. Whether the test settings, results and conclusions have changed can be identified in the text."
    mostly: "There is a robustness or supplementary analysis that falls on the key link of the conclusion. The test results are reported in the text. The reader can see that the threat has been dealt with according to the author's instructions.\nThe robustness or supplementary analysis done by"
    partial: "focuses on secondary links, and the most vulnerable points have not been tested. Readers still have doubts about whether this point is established."
    weak: "only performed routine actions such as alternative measurements and sample changes, and did not design tests for the weak points of the conclusion. The reader does not know whether the conclusion is valid or not."
    not_satisfied: "There is no test for the weak link in the conclusion in the full text, or the test is irrelevant to the main conclusion, and the main question has not been answered from the beginning."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
  score_mapping:
    satisfied: 1.0
