  threshold: "The text identifies the design type and its temporal hierarchy, and explains why this structure is sufficient to respond to the proposed inferred type."
  mostly_threshold: "The text can identify the design type and its temporal and hierarchical structure, which is sufficient to respond to the type of inference proposed by the paper."
- rule_id: D-DATA-SAMPLE-V1
  version: V1
  dimension_id: D
  dimension_name: "Study design and methodological quality"
  indicator_name: "The data source and sample are reasonable"
  definition: "Determine whether data sources, sample selection, sample size, time frame, and scenarios are appropriate for the research question."
  required_evidence: "Data sources, sample acquisition, sample characteristics, time range, or inclusion and exclusion criteria need to be cited."
  evidence_location:
  - Methods
  - Data
  - Sample
  observation_points:
  - "Is the data source clear?"
  - "Whether the sample matches the research object"
  - "Does the sample size support analysis?"
  - "Does it explain the data acquisition process and restrictions?"
  judgement_values:
    satisfied: "In addition to explaining the source and scale, it also provides the basis for testing the representative performance (comparison with the target population, inclusion and exclusion criteria, or sample loss analysis). Readers can judge which side the representative bias will pull the conclusion."
    mostly: "The data source and scale are clearly explained, and the sampling method and key characteristics are thinly explained. The representativeness is generally credible, but readers still have questions."
    partial: "The source and scale are explained, and the sampling method or sample characteristics are not explained enough. It is difficult for readers to judge the degree of representativeness of the sample to the target population.\nThe"
    weak: "sample is only available in one aspect, and this limitation happens to cover the core inference of the paper, and the conclusion can only be reduced to a smaller scope."
    not_satisfied: "The data source or sample size is missing, or the sample is obviously misaligned with the research population, making the main analysis of the paper based on untenable samples."
    uncertain: "The analysis is missing or the candidate evidence is too narrow, or the paper is in a theoretical or qualitative genre that does not use statistical samples to answer questions, making this judgment difficult to make."
