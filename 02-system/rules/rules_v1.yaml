  - "Whether to report key missing or abnormal"
  judgement_values:
    mostly: "Each core question has readable numerical values and test statistics in the text or tables. Readers can check the conclusions without having to convert or calculate by themselves."
    partial: "The key values of the core issues have been reported. Some analyzes only give directional descriptions or are scattered in many places. Readers can still check the conclusions by matching several points."
    weak: "Key analysis only gives significance and direction. The sample size, effect size or coding frequency are missing. Readers have no way to check whether the conclusion is derived from these results."
    not_satisfied: "Multiple conclusions cannot be found in the results section with corresponding values or codes. Readers can only accept the author's statement without any way to check."
    uncertain: "The analysis is missing, the candidate evidence is too narrow, or the research paradigm is not applicable and the judgment cannot be stable."
