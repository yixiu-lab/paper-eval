  - long-term
  - stakeholders
  - employees
  - well-being
  - inequality
  - responsible
  - sustainability
  - externalities
  - public interest
  rationale: "The current weight of this rule is 0. It does not count and is only an observation item. Five levels of description for future use: the degree of connection between the consequence discussion and the evidence of this article decreases, from all objects and standards to no involvement at all."
  threshold: "Locates a specific statement of long-term or social consequences that cites the results of this article or contextual evidence."
  mostly_threshold: "There is a statement in the text about long-term or social consequences that is connected to the results of this article, rather than just mentioned in passing."
