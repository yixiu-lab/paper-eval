  rationale: "Misaligned operationalization can cause results to lose connection with theoretical claims. The fifth level is in descending order according to the degree of equivalence between operationalization and construct: it is considered sufficient if the basis can support operationalization, and it is a middle ground that only covers part of the connotation."
  threshold: "The main text can identify the correspondence between measurement or coding and constructs, and provide validity or adaptation basis to enable readers to accept the operationalization."
  mostly_threshold: "The measurement or coding scheme is consistent with the construct, and readers can accept the operationalization; incomplete reliability or validity testing, and failure to explain the basis for adaptation item by item will not affect this document."
  mostly_note: "does not require reporting of all reliability and validity indicators (such as α, CR, and AVE given at the same time); as long as the correspondence between operationalization and constructs is identifiable."
- rule_id: D-MODEL-IDENTIFICATION-V1
  version: V1
  dimension_id: D
  dimension_name: "Study design and methodological quality"
  indicator_name: "model setting and identification strategy are reasonable"
  definition: "Determine whether the model settings, control variables, identification strategies or analysis frameworks are reasonable and can reduce bias and support inference."
  required_evidence: "It is necessary to cite the original description of the model specification, control variables, identification strategy, estimation method or analysis framework."
  evidence_location:
