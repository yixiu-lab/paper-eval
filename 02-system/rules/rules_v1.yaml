  - "Is the inductive reasoning consistent with the data?"
  - "Whether there are obvious counterexamples that have not been processed"
  - "Is the conclusion naturally derived from the previous article?"
  judgement_values:
    mostly: "The main line of reasoning can be followed, but some links rely on unstated assumptions or make jumps. Readers need to make up one step by themselves to reach the following conclusion."
    partial: "The main line of reasoning can be read along, but the key points are missing. The reader has to provide a reason for the author to make the conclusion come true."
    weak: "Several links from the premise to the conclusion contain only assertions without reasons. Readers cannot draw conclusions based on the arguments in the text and can only accept them as the author's claims."
    not_satisfied: "There is an obvious breakpoint in the reasoning chain, or the conclusion is not derived from the previous premises, and the reader cannot reproduce the process of reaching the conclusion based on the arguments in the text."
    uncertain: "The analysis is missing or the candidate evidence is too narrow, or the paper is presented in a narrative manner without a complete reasoning process, making the judgment unable to be stably made."
