- rule_id: E-RESULTS-COMPLETENESS-V1
  version: V1
  dimension_id: E
  dimension_name: "Credibility of evidence, results and conclusions"
  indicator_name: "results present complete specification"
  definition: "Determine whether the results completely present core analysis, key indicators, statistical/coding results and necessary table illustrations."
