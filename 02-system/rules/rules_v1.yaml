  judgement_values:
    mostly: "Take any of the above paths: name a questionable premise, give the direction of the source of disagreement, or point out what is more in this article than the existing understanding, and readers can point out where the advancement lies."
    partial: "has contacts with the literature, but the advancement is only mentioned as enriching relevant research. Readers can see that this article wants to advance, but cannot tell where the advancement falls."
    weak: "The conclusion reiterates the main points of existing understanding. The reader cannot see what is more in this article compared to the literature, and the contribution claims lack an identifiable landing point."
    not_satisfied: "This element is missing: the full text does not question the existing understanding, does not deal with the differences in conclusions, and does not compare the understanding of this article with the existing understanding."
    uncertain: "There is a lack of analysis, the candidate evidence is too narrow, or the style of the paper does not organize the argument in a way that advances the existing understanding, so this item lacks a text to base on."
