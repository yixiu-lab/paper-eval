# External Literature Retrieval Evaluation——Experimental configuration baseline
#
# This file records the retrieval/rearrangement configuration used in this formal experiment, as the "Experimental Setup" section of the paper.
# Machine-readable source. The command line parameters are the same as here; `experiments/<name>/experiment_manifest.json`
# is a snapshot of the actual effective value at runtime. The two should be consistent - if they are inconsistent, the manifest takes precedence.
#
# Usage:
#   python -m paper_eval.retrieval_eval.cli run-all \
#       --experiment external_retrieval \
#       --scope data/retrieval_gold/experiment_scope.json \
#       --per-paper 8 --per-type 2 \
#       --per-claim-limit 8 \
#       --per-query-limit 20 --max-queries 5 --candidate-pool-limit 120 \
#       --citation-source openalex --openalex-reference-limit 120 \
#       --min-interval 0.6 --bootstrap 2000 --seed 20260101

experiment:
  name: external_retrieval
  seed: 20260101
  bootstrap_iterations: 2000
  K: [5, 10, 20, 50]

gold_set:
    # Gold's discovery path: the target paper's referenced_works (author's own citation network) registered in OpenAlex.
    # deliberately does not use the search results of PaperEval to avoid retrieval pool bias.
  discovery: openalex_referenced_works
  claim_source: paper_body_claim_markers
  selection:
    per_paper_limit: 8
    per_type_limit: 2
  gold_mapping:
    min_relevance: 2
    per_claim_limit: 8
        # Machine prelabel (claim term ∩ prior title/abstract), annotation_status=machine_prelabel.
        # The final value of
        # relevance can only be determined by manual annotation of annotation_records.jsonl.
    method: lexical_term_overlap

retrieval:
  providers: [crossref, openalex, semantic_scholar_bulk]
  per_query_limit: 20
  max_queries_per_claim: 5
  candidate_pool_limit: 120
  min_interval_seconds: 0.6
  request_retries: 3
  timeout_seconds: 25
  time_leak_policy: "publication_year exists and < target_paper_year"
  routes:
    query: "Each claim is expanded by paper title + claim terms and 3-5 search terms"
    citation: "target paper → referenced_works (OpenAlex, full enumeration)"
    semantic: "TF-IDF cosine of claim/abstract/research question with candidate title+abstract (local, no external calls)\nThere is no Gold with relevance>=2 in"

reranker:
  kind: deterministic_weighted_signals
  module: paper_eval.literature_search.literature_rerank
  signals:
    topic_relevance: 0.26
    construct_overlap: 0.20
    theory_relevance: 0.10
    mechanism_relevance: 0.10
    context_relevance: 0.08
    semantic_similarity: 0.18
    citation_relationship: 0.05
    publication_year: 0.03
  route_weight:
    citation: 0.10
    semantic: 0.08
    query: 0.05
  llm_rerank: false

ablation_methods:
  - {method: query, routes: [query], reranker: false}
  - {method: citation, routes: [citation], reranker: false}
  - {method: semantic, routes: [semantic], reranker: false}
  - {method: query_citation, routes: [query, citation], reranker: false}
  - {method: query_semantic, routes: [query, semantic], reranker: false}
  - {method: multi_route, routes: [query, citation, semantic], reranker: false}
  - {method: multi_route_reranker, routes: [query, citation, semantic], reranker: true}

failure_case_rules:
  low_recall_at_20: recall@20 < 0.34
  low_ndcg_at_10: nDCG@10 < 0.30
  no_gold_in_top10: "Top-10"

notes:
  - "There is no LLM involved in the entire retrieval and rearrangement process, and the results can be accurately reproduced (bit by bit consistent under the same cache and configuration)."
  - "The year of the target paper is taken from the paper metadata/file name; if the candidate year is missing, it will not enter the candidate pool."
  - "Citation Road's gold structural advantages are disclosed separately in the report (see README Research Integrity Constraints §3)."
