agent_runtime:
  mode: llm
  provider: openai_compatible
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4.1-mini
  temperature: 0
  timeout_seconds: 120
  max_evidence_per_rule: 6
  enable_llm_agents: true

apis_needed:
  required_for_current_mvp:
    - "Cloud LLM API Key"
    - OpenAI-compatible chat completions endpoint
  required_for_llm_agents:
    - "OPENAI_API_KEY or other OpenAI-compatible service key"
  optional_for_better_pdf_parsing:
    - GROBID service URL
    - MinerU local/runtime service
  optional_for_vector_search:
    - "Embedding model API key or local embedding model"
    - PostgreSQL pgvector / Milvus / FAISS
  optional_for_metadata:
    - Crossref API
    - Semantic Scholar API
